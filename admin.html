<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="media/favicon.png">
    <title>Analyst Wire | Admin Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0f1115; color: white; font-family: sans-serif; margin: 0; }

        /* Top Navigation */
        .top-nav { background: #1c2230; padding: 15px 20px; display: flex; gap: 20px; border-bottom: 2px solid #2a2e39; align-items: center; }
        .top-nav button, .top-nav a { background: none; border: none; color: #787b86; cursor: pointer; font-size: 1rem; text-decoration: none; font-weight: bold; }
        .top-nav button:hover, .top-nav a:hover { color: #fff; }
        .top-nav .active { color: #2962ff; }

        .admin-container { max-width: 1200px; margin: 20px auto; background: #1a1d23; border-radius: 8px; padding: 20px; }

        /* Sections */
        .section { display: none; }
        .section.active { display: block; }

        /* Management Panel */
        .manage-user-form { background: #242831; padding: 15px; border-radius: 6px; margin-bottom: 25px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; border: 1px solid #333; }
        .manage-user-form h3 { margin: 0 10px 0 0; font-size: 1rem; color: #888; }
        .manage-user-form input, .manage-user-form select { padding: 8px; background: #1a1d23; border: 1px solid #333; color: white; border-radius: 4px; }

        .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; justify-content: space-between; }
        .filters { display: flex; gap: 10px; align-items: center; }
        .search-box, .filter-select { padding: 8px; background: #242831; border: 1px solid #333; color: white; border-radius: 4px; }

        /* Table & Sorting */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        tr:hover { background: #2a2e39; }
        th, td { padding: 12px; border: 1px solid #333; text-align: left; }
        th { background: #242831; text-transform: uppercase; font-size: 0.75rem; color: #888; user-select: none; }
        th.sortable { cursor: pointer; transition: color 0.2s; }
        th.sortable:hover { color: #fff; background: #2a2e39; }
        .sort-icon { font-size: 0.7rem; margin-left: 5px; color: #555; }
        
        .status-active { color: #089981; font-weight: bold; }
        .status-inactive { color: #f23645; font-weight: bold; }
        
        .btn-profile { background: #333; color: white; border: 1px solid #555; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; transition: background 0.2s; }
        .btn-profile:hover { background: #2962ff; border-color: #2962ff; }

        /* Modal Overlay */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; }
        .modal { background: #1a1d23; border: 1px solid #333; border-radius: 8px; width: 100%; max-width: 500px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .modal-header h2 { margin: 0; font-size: 1.2rem; }
        .close-btn { background: none; border: none; color: #888; font-size: 1.5rem; cursor: pointer; }
        .close-btn:hover { color: #f23645; }
        
        .profile-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 20px; }
        .profile-group { display: flex; flex-direction: column; gap: 5px; }
        .profile-group label { font-size: 0.8rem; color: #888; text-transform: uppercase; }
        .profile-group input { padding: 10px; background: #242831; border: 1px solid #333; color: white; border-radius: 4px; }
        .profile-group .readonly-data { padding: 10px; background: #0f1115; border: 1px solid #333; border-radius: 4px; color: #ccc; font-family: monospace; font-size: 0.9rem; }
        
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #333; padding-top: 15px; }
        .btn-save { background: #089981; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-save:hover { background: #067a67; }
    </style>
</head>
<body>

<div class="top-nav">
    <button onclick="showSection('users', this)" class="active">Users</button>
    <button onclick="showSection('revenue', this)">Revenue</button>
    <a href="terminal.html">Terminal</a>
    <a href="admin_upload.html">Upload Data</a>
    <button id="logoutBtn">Logout</button>
</div>

<div class="admin-container">

    <div id="users-section" class="section active">
        <div class="manage-user-form">
            <h3>Edit/Invite User</h3>
            <input type="email" id="m-email" placeholder="Email">
            <input type="text" id="m-name" placeholder="Full Name">
            <select id="m-tag">
                <option value="pro">Pro</option>
                <option value="course">Course</option> <!-- Added Course -->
                <option value="newsfeed">Newsfeed</option>
                <option value="audio squawk">Audio Squawk</option>
                <option value="free">Free (No Access)</option>
                <option value="admin">Admin</option>
            </select>
            <input type="datetime-local" id="m-expiry" title="Trial Record Date">
            <button onclick="saveUser()" style="background:#2962ff; color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer;">Update / Invite</button>
        </div>

        <div class="controls">
            <div class="filters">
                <h2 style="margin: 0; margin-right: 15px;">User Management</h2>
                <input type="text" id="search" class="search-box" placeholder="Search name or email...">
                <select id="filter-status" class="filter-select">
                    <option value="all">Status: All</option>
                    <option value="active">Active</option>
                    <option value="canceled">Canceled</option>
                </select>
                <select id="filter-tag" class="filter-select">
                    <option value="all">Tag: All</option>
                    <option value="pro">Pro</option>
                    <option value="course">Course</option> <!-- Added Course -->
                    <option value="audio squawk">Audio Squawk</option>
                    <option value="newsfeed">Newsfeed</option>
                    <option value="free">Free</option>
                </select>
            </div>
            <button onclick="forceDowngradeCancelled()" style="background:#f23645; color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer; font-weight:bold;">Clean Up Cancelled Users</button>
        </div>
        
        <table id="admin-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th class="sortable" onclick="handleSort('tag')">Tag <span id="sort-icon-tag" class="sort-icon">↕</span></th>
                    <th class="sortable" onclick="handleSort('status')">Status <span id="sort-icon-status" class="sort-icon">↕</span></th>
                    <th>Trial Record</th>
                    <th class="sortable" onclick="handleSort('billing')">Next Billing <span id="sort-icon-billing" class="sort-icon">↕</span></th>
                    <th class="sortable" onclick="handleSort('cancel')">Cancel? <span id="sort-icon-cancel" class="sort-icon">↕</span></th>
                    <th>Profile</th> <!-- New Column -->
                </tr>
            </thead>
            <tbody id="admin-body">
                <tr><td colspan="8" style="text-align:center;">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="revenue-section" class="section">
        <h2>Revenue Overview</h2>
        <p style="color: #787b86;">Revenue data module initialization pending...</p>
    </div>

</div>

<!-- Profile Modal -->
<div class="modal-overlay" id="profileModal">
    <div class="modal">
        <div class="modal-header">
            <h2>User Profile Details</h2>
            <button class="close-btn" onclick="closeProfileModal()">×</button>
        </div>
        
        <div class="profile-grid">
            <input type="hidden" id="p-id">
            
            <div class="profile-group">
                <label>Full Name</label>
                <input type="text" id="p-name" placeholder="Full Name">
            </div>
            
            <div class="profile-group">
                <label>Email Address</label>
                <input type="email" id="p-email" placeholder="Email Address">
            </div>

            <div class="profile-group">
                <label>Last Logged In</label>
                <div class="readonly-data" id="p-last-login">Fetching...</div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="profile-group">
                    <label>Country (IP)</label>
                    <div class="readonly-data" id="p-country">Requires Backend Tracker</div>
                </div>
                <div class="profile-group">
                    <label>Device Used</label>
                    <div class="readonly-data" id="p-device">Requires Backend Tracker</div>
                </div>
            </div>
        </div>

        <div class="modal-actions">
            <button class="btn-save" id="btn-save-profile" onclick="saveProfileDetails()">Save Changes</button>
        </div>
    </div>
</div>

<script>
    const client = supabase.createClient('https://fgidelsazisdqjfckerd.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnaWRlbHNhemlzZHFqZmNrZXJkIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4Mjk0NzU4NCwiZXhwIjoyMDk4NTIzNTg0fQ.2UkKkgfJ6oERQrp2VOtiL9YP2MXKVWARAdoEkB5YJbY');

    let allUsers = [];
    let currentFilteredUsers = [];
    
    // Sorting State
    let sortState = { column: null, asc: true };

    async function init() {
        const { data: { session } } = await client.auth.getSession();
        if (!session) { window.location.href = 'index.html'; return; }
        const { data: profile } = await client.from('profiles').select('is_admin').eq('id', session.user.id).single();
        if (!profile || profile.is_admin !== true) { window.location.href = 'terminal.html'; return; }

        const { data, error } = await client.from('profiles').select('*');
        if (error) { document.getElementById('admin-body').innerHTML = `<tr><td colspan="8" style="text-align:center;">Error: ${error.message}</td></tr>`; return; }
        
        allUsers = data;
        applyFilters(); // This will render the table
    }

    // --- SORTING LOGIC ---
    function handleSort(column) {
        if (sortState.column === column) {
            sortState.asc = !sortState.asc; // Toggle direction
        } else {
            sortState.column = column;
            sortState.asc = true; // Default to ascending on new column
        }

        // Reset all icons
        document.querySelectorAll('.sort-icon').forEach(icon => icon.innerText = '↕');
        document.querySelectorAll('.sort-icon').forEach(icon => icon.style.color = '#555');
        
        // Update active icon
        const activeIcon = document.getElementById(`sort-icon-${column}`);
        activeIcon.innerText = sortState.asc ? '↑' : '↓';
        activeIcon.style.color = '#2962ff';

        sortData();
    }

    function sortData() {
        if (!sortState.column) return;

        currentFilteredUsers.sort((a, b) => {
            let valA, valB;

            switch (sortState.column) {
                case 'tag':
                    valA = a.subscription_tag || '';
                    valB = b.subscription_tag || '';
                    break;
                case 'status':
                    valA = String(a.sub_status || 'inactive').toLowerCase();
                    valB = String(b.sub_status || 'inactive').toLowerCase();
                    break;
                case 'billing':
                    valA = a.current_period_end ? new Date(a.current_period_end).getTime() : 0;
                    valB = b.current_period_end ? new Date(b.current_period_end).getTime() : 0;
                    break;
                case 'cancel':
                    const rawCancelA = String(a.cancel_at_period_end || '').toLowerCase();
                    valA = rawCancelA.includes('true') || rawCancelA.includes('cancel') ? 1 : 0;
                    const rawCancelB = String(b.cancel_at_period_end || '').toLowerCase();
                    valB = rawCancelB.includes('true') || rawCancelB.includes('cancel') ? 1 : 0;
                    break;
            }

            if (valA < valB) return sortState.asc ? -1 : 1;
            if (valA > valB) return sortState.asc ? 1 : -1;
            return 0;
        });

        renderTable(currentFilteredUsers);
    }

    function renderTable(users) {
        const tbody = document.getElementById('admin-body');
        tbody.innerHTML = users.length ? users.map(u => {
            
            const rawCancel = String(u.cancel_at_period_end || '').toLowerCase();
            const isCancelled = rawCancel.includes('true') || rawCancel.includes('cancel');
            const cancelLabel = isCancelled ? 'Cancelled' : 'Active';
            const cancelClass = isCancelled ? 'status-inactive' : 'status-active';
            
            const subStatusRaw = String(u.sub_status || 'inactive').toLowerCase();
            const isSubActive = subStatusRaw === 'active';
            const subStatusLabel = isSubActive ? 'ACTIVE' : 'INACTIVE';
            const subStatusClass = isSubActive ? 'status-active' : 'status-inactive';

            return `
            <tr style="cursor: pointer;" onclick="selectUser('${u.email}', '${u.full_name || ''}', '${u.subscription_tag || ''}')">
                <td>${u.full_name || '-'}</td>
                <td>${u.email || '-'}</td>
                <td>${u.subscription_tag || '-'}</td>
                <td class="${subStatusClass}">${subStatusLabel}</td>
                <td>${u.trial_expires_at ? new Date(u.trial_expires_at).toLocaleDateString() : '-'}</td>
                <td>${u.current_period_end ? new Date(u.current_period_end).toLocaleDateString() : '-'}</td>
                <td class="${cancelClass}">${cancelLabel}</td>
                <td><button class="btn-profile" onclick="event.stopPropagation(); openProfileModal('${u.id}')">View</button></td>
            </tr>
        `}).join('') : '<tr><td colspan="8" style="text-align:center;">No users found.</td></tr>';
    }

    function applyFilters() {
        const term = document.getElementById('search').value.toLowerCase();
        const statusFilter = document.getElementById('filter-status').value;
        const tag = document.getElementById('filter-tag').value;

        currentFilteredUsers = allUsers.filter(u => {
            const matchesSearch = (u.full_name?.toLowerCase().includes(term)) || (u.email?.toLowerCase().includes(term));
            
            const rawCancel = String(u.cancel_at_period_end || '').toLowerCase();
            const isCancelled = rawCancel.includes('true') || rawCancel.includes('cancel');
            
            let matchesStatus = true;
            if (statusFilter === 'active') matchesStatus = !isCancelled;
            if (statusFilter === 'canceled') matchesStatus = isCancelled;
            
            const matchesTag = (tag === 'all') || (u.subscription_tag?.toLowerCase() === tag);
            return matchesSearch && matchesStatus && matchesTag;
        });
        
        // Re-apply sorting if a column is selected
        if (sortState.column) {
            sortData();
        } else {
            renderTable(currentFilteredUsers);
        }
    }

    // --- QUICK EDIT FORM (Top) ---
    function selectUser(email, name, tag) {
        document.getElementById('m-email').value = email;
        document.getElementById('m-name').value = name || '';
        document.getElementById('m-tag').value = tag || 'free';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function saveUser() {
        const email = document.getElementById('m-email').value;
        const name = document.getElementById('m-name').value;
        const tag = document.getElementById('m-tag').value;
        const expiry = document.getElementById('m-expiry').value;

        if (!email) return alert("Email is required");

        const { data: existingUser } = await client.from('profiles').select('id').eq('email', email).maybeSingle();

        if (existingUser) {
            const newSubStatus = tag === 'free' ? 'inactive' : 'active';
            const { error } = await client.from('profiles').update({
                full_name: name,
                subscription_tag: tag,
                sub_status: newSubStatus,
                trial_expires_at: expiry || null
            }).eq('email', email);

            if (error) alert('Update Error: ' + error.message);
            else { alert('User updated successfully!'); init(); }
        } else {
            const { error } = await client.auth.admin.inviteUserByEmail(email, {
                redirectTo: 'https://analyst-wire.pages.dev/setup',
                data: { full_name: name, subscription_tag: tag, sub_status: tag === 'free' ? 'inactive' : 'active', trial_expires_at: expiry || null }
            });
            if (error) alert('Invite Error: ' + error.message);
            else { alert('Invite sent!'); init(); }
        }
    }

    async function forceDowngradeCancelled() {
        if (!confirm("This will instantly downgrade all cancelled users to 'free' and 'inactive'. Proceed?")) return;
        
        const toDowngrade = allUsers.filter(u => {
            const rawCancel = String(u.cancel_at_period_end || '').toLowerCase();
            const isCancelled = rawCancel.includes('true') || rawCancel.includes('cancel');
            return isCancelled && (u.subscription_tag !== 'free' || String(u.sub_status).toLowerCase() !== 'inactive');
        });

        if (toDowngrade.length === 0) {
            alert("No cancelled users found that need downgrading. Everything is clean!");
            return;
        }

        let successCount = 0;
        for (const user of toDowngrade) {
            const { error } = await client.from('profiles').update({
                subscription_tag: 'free',
                sub_status: 'inactive'
            }).eq('id', user.id);
            if (!error) successCount++;
        }

        alert(`Successfully downgraded ${successCount} cancelled user(s).`);
        init(); 
    }

    // --- PROFILE MODAL LOGIC ---
    async function openProfileModal(userId) {
        document.getElementById('profileModal').style.display = 'flex';
        const userRow = allUsers.find(u => u.id === userId);
        
        document.getElementById('p-id').value = userId;
        document.getElementById('p-name').value = userRow.full_name || '';
        document.getElementById('p-email').value = userRow.email || '';
        document.getElementById('p-last-login').innerText = 'Fetching...';

        // Fetch auth data using the service role key embedded in this client
        const { data: authData, error } = await client.auth.admin.getUserById(userId);
        
        if (error) {
            document.getElementById('p-last-login').innerText = "Unable to load data.";
        } else if (authData && authData.user) {
            const lastLogin = authData.user.last_sign_in_at;
            document.getElementById('p-last-login').innerText = lastLogin ? new Date(lastLogin).toLocaleString() : 'Never logged in';
        }
    }

    function closeProfileModal() {
        document.getElementById('profileModal').style.display = 'none';
    }

    async function saveProfileDetails() {
        const userId = document.getElementById('p-id').value;
        const newName = document.getElementById('p-name').value;
        const newEmail = document.getElementById('p-email').value;
        const saveBtn = document.getElementById('btn-save-profile');

        saveBtn.innerText = "Saving...";
        saveBtn.disabled = true;

        try {
            // 1. Update Email in Auth Server (Requires Service Role Key)
            const { error: authError } = await client.auth.admin.updateUserById(userId, { email: newEmail });
            if (authError) throw authError;

            // 2. Update Name and Email in Profiles Table
            const { error: dbError } = await client.from('profiles').update({
                full_name: newName,
                email: newEmail
            }).eq('id', userId);
            
            if (dbError) throw dbError;

            alert("Profile details updated successfully!");
            closeProfileModal();
            init(); // Refresh table
        } catch (err) {
            alert("Error saving profile: " + err.message);
        } finally {
            saveBtn.innerText = "Save Changes";
            saveBtn.disabled = false;
        }
    }

    // --- NAVIGATION ---
    function showSection(id, btn) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.top-nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(id + '-section').classList.add('active');
        btn.classList.add('active');
    }

    // Listeners
    document.getElementById('logoutBtn').addEventListener('click', async () => { await client.auth.signOut(); window.location.href = 'index.html'; });
    document.getElementById('search').addEventListener('input', applyFilters);
    document.getElementById('filter-status').addEventListener('change', applyFilters);
    document.getElementById('filter-tag').addEventListener('change', applyFilters);

    init();
</script>
</body>
</html>
