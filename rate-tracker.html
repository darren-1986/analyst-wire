<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="media/favicon.png">
    <title>Central Bank Rates | Analyst Wire</title>
    <!-- 1. Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <!-- 2. Chart.js for visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        *, *:before, *:after { box-sizing: border-box; }
        
        body { margin: 0; padding-top: 55px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; background-color: #0A0A0a; color: #ffffff; overflow: hidden; }

        /* Navigation */
        .top-nav { background: #0d1117; padding: 0 20px; height: 55px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1c2230; z-index: 1000; position: fixed; top: 0; left: 0; width: 100%; font-family: 'Inter', sans-serif; }
        .nav-links { display: flex; align-items: center; gap: 5px; }
        .nav-links a { color: #8b949e; text-decoration: none; margin-left: 15px; font-size: 13px; font-weight: 500; cursor: pointer; transition: color 0.2s; padding: 6px 12px; border-radius: 6px; }
        .nav-links a:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .nav-links a.active { color: #00b4f9; font-weight: 600; background: rgba(0, 180, 249, 0.1); }
        .mobile-menu-btn { display: none; font-size: 24px; color: #8b949e; cursor: pointer; background: none; border: none; }

        .dropdown { position: relative; margin-left: 10px; }
        .dropbtn { background: none; border: none; color: #8b949e; cursor: pointer; font-size: 18px; padding: 5px; transition: color 0.2s; }
        .dropbtn:hover { color: #fff; }
        .dropdown-content { display: none; position: absolute; right: 0; top: 35px; background-color: #161b22; min-width: 160px; border: 1px solid #30363d; z-index: 1000; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); overflow: hidden; }
        .dropdown-content a { color: #c9d1d9; padding: 10px 16px; text-decoration: none; display: block; font-size: 13px; font-family: 'Inter', sans-serif; }
        .dropdown-content a:hover { background-color: #21262d; color: #fff; }

        /* Dashboard Wrapper */
        .dashboard-wrapper { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; padding: 0; position: relative; }
        
        /* Dashboard Header */
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid #1c2230; background: #0d1117; flex-shrink: 0; }
        .dashboard-header h1 { font-family: 'Inter', sans-serif; font-size: 16px; margin: 0; color: #fff; display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .status-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8b949e; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Tabs Navigation */
        .tabs-nav { display: flex; background: #161b22; border-bottom: 1px solid #1c2230; padding: 10px 20px 0 20px; gap: 5px; flex-shrink: 0; overflow-x: auto; }
        .tab-btn { background: none; border: 1px solid #1c2230; border-bottom: none; color: #8b949e; padding: 10px 16px; border-radius: 8px 8px 0 0; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all 0.2s; position: relative; bottom: -1px; }
        .tab-btn:hover { background: rgba(255,255,255,0.03); color: #fff; }
        .tab-btn.active-tab { background: #0A0A0a; color: #00b4f9; border-color: #1c2230; font-weight: 600; border-bottom: 1px solid #0A0A0a; }

        /* Tab Content Area */
        .tab-content-area { flex-grow: 1; padding: 20px; overflow-y: auto; background: #0A0A0a; position: relative; }
        .tab-pane { display: none !important; width: 100%; }
        .tab-pane.active-pane { display: block !important; }

        /* Empty State */
        .empty-state { text-align: center; padding: 40px 20px; color: #8b949e; font-family: 'Inter', sans-serif; font-size: 14px; border: 1px dashed #1c2230; border-radius: 12px; margin-top: 20px; }

        /* Card & Table Styling */
        .bank-card { background: #0d1117; border: 1px solid #1c2230; border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
        .bank-card-header { background: #161b22; padding: 12px 20px; border-bottom: 1px solid #1c2230; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; color: #e2e8f0; display: flex; justify-content: space-between; }
        
        table { width: 100%; border-collapse: collapse; font-family: 'Inter', sans-serif; font-size: 13px; }
        th, td { padding: 12px 20px; text-align: left; border-bottom: 1px solid #1c2230; }
        th { color: #8b949e; font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        td { color: #c9d1d9; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .highlight-green { color: #22c55e; }
        .highlight-blue { color: #00b4f9; }

        /* Chart Canvas Holder */
        .chart-holder { padding: 20px; background: rgba(0,0,0,0.3); border-bottom: 1px solid #1c2230; height: 260px; width: 100%; position: relative; }

        /* LOADING OVERLAY */
        #global-loader { display: flex; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0A0A0a; z-index: 50; flex-direction: column; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; transition: opacity 0.3s; }
        .spinner { border: 3px solid #161b22; border-top: 3px solid #00b4f9; border-radius: 50%; width: 36px; height: 36px; animation: spin 0.8s linear infinite; margin-bottom: 15px; }
        .loading-text { color: #c9d1d9; font-size: 14px; font-weight: 500; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 950px) {
            .mobile-menu-btn { display: block; }
            .nav-links { display: none; position: absolute; top: 55px; left: 0; width: 100%; background: #0d1117; flex-direction: column; align-items: flex-start; padding: 10px 20px; border-bottom: 1px solid #1c2230; z-index: 1001; }
            .nav-links.active-nav { display: flex; }
            .nav-links a { margin: 5px 0; width: 100%; text-align: left; padding-left: 0; }
            .chart-holder { height: 200px; padding: 10px; }
        }
    </style>
</head>
<body class="dark">

    <div class="top-nav">
       <div style="height: 50px; display: flex; align-items: center;">
            <img src="assets/logo.png" alt="Analyst Wire" style="height: 35px;" onerror="this.style.display='none'">
       </div>
       
       <button class="mobile-menu-btn" onclick="toggleNav()">☰</button>
       
       <div class="nav-links" id="navLinks">
            <a href="terminal.html" id="nav-dashboard" style="display: none;">Dashboard</a>
            <a href="/newsfeed" id="nav-newsfeed" style="display: none;">Newsfeed</a>
            <a href="rates.html" id="nav-rates" class="active">Rates Pricing</a>
            <a href="key-levels.html" id="nav-key-levels" style="display: none;">Key Levels</a>
            <a href="analysis.html" id="nav-analysis" style="display: none;">Analysis</a>
            <a href="profile.html" id="nav-profile" style="display: none;">Network</a>
            <a href="courses.html" id="nav-courses" style="display: none;">Courses</a>
            
            <div class="dropdown">
                <button class="dropbtn" onclick="toggleDropdown(event)">⚙️</button>
                <div id="settingsDropdown" class="dropdown-content">
                    <a href="account.html">Account</a>
                    <a href="support.html" class="sub-link">Support</a>
                    <a id="nav-admin" style="display: none;" href="admin.html">Admin</a>
                    <a id="nav-upload" style="display: none;" href="admin_upload.html">Upload Data</a>
                    <a id="logoutBtn" style="color: #f85149; cursor: pointer;">Logout</a>
                </div>
            </div>
       </div>
    </div>

    <div class="dashboard-wrapper">
        <div class="dashboard-header">
            <h1>Central Bank Rate Expectations</h1>
            <div class="status-text" id="status-indicator">Connecting to Database...</div>
        </div>

        <div class="tabs-nav" id="mainTabs">
            <button class="tab-btn active-tab" data-tab="main">Overview</button>
            <button class="tab-btn" data-tab="fed">USA (FED)</button>
            <button class="tab-btn" data-tab="ecb">Europe (ECB)</button>
            <button class="tab-btn" data-tab="boe">UK (BOE)</button>
            <button class="tab-btn" data-tab="boj">Japan (BOJ)</button>
            <button class="tab-btn" data-tab="boc">Canada (BOC)</button>
            <button class="tab-btn" data-tab="rba">Australia (RBA)</button>
        </div>

        <div class="tab-content-area" id="tabContent">
            
            <!-- LOADING SCREEN -->
            <div id="global-loader">
                <div class="spinner"></div>
                <div class="loading-text" id="loader-primary-msg">Loading database...</div>
            </div>

            <!-- Tab Panes -->
            <div id="main-pane" class="tab-pane active-pane"></div>
            <div id="fed-pane" class="tab-pane"></div>
            <div id="ecb-pane" class="tab-pane"></div>
            <div id="boe-pane" class="tab-pane"></div>
            <div id="boj-pane" class="tab-pane"></div>
            <div id="boc-pane" class="tab-pane"></div>
            <div id="rba-pane" class="tab-pane"></div>
        </div>
    </div>

    <script>
        // --- MULTI-DATABASE CONFIGURATION ---
        const authClient = supabase.createClient(
            'https://fgidelsazisdqjfckerd.supabase.co', 
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnaWRlbHNhemlzZHFqZmNrZXJkIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4Mjk0NzU4NCwiZXhwIjoyMDk4NTIzNTg0fQ.2UkKkgfJ6oERQrp2VOtiL9YP2MXKVWARAdoEkB5YJbY'
        );
        
        const dataClient = supabase.createClient(
            'https://nayucfhbnecwhtzuaiur.supabase.co', 
            'sb_publishable_yNK-_0-3ZI2ssYfbSvw75g_RXLD_R-A'
        );

        let chartInstances = {};
        let globalBankData = []; // Store global data to access 'main' overview stats across all tabs
        
        const CACHE_KEY = 'aw_central_bank_rates_cache';
        const CACHE_LIFESPAN_MS = 1000 * 60 * 60 * 3; // 3 Hours

        const banksToFetch = [
            { id: 'main', title: 'Next Meeting Overview' },
            { id: 'fed', title: 'Federal Reserve (USA)' },
            { id: 'ecb', title: 'European Central Bank (ECB)' },
            { id: 'boe', title: 'Bank of England (BOE)' },
            { id: 'boj', title: 'Bank of Japan (BOJ)' },
            { id: 'boc', title: 'Bank of Canada (BOC)' },
            { id: 'rba', title: 'Reserve Bank of Australia (AUD)' }
        ];

        function userHasAccess(userTags, requiredTag) {
            if (!userTags) return false;
            let tagsArray = Array.isArray(userTags) ? userTags : [];
            if (typeof userTags === 'string') { 
                try { let parsed = JSON.parse(userTags); tagsArray = Array.isArray(parsed) ? parsed : [userTags]; } 
                catch (e) { tagsArray = userTags.split(',').map(s => s.trim()); } 
            }
            return tagsArray.some(tag => String(tag).toLowerCase() === requiredTag.toLowerCase());
        }

        async function init() {
            const { data: { session } } = await authClient.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            
            const { data: profileArray, error: profileError } = await authClient.from('profiles').select('admin, active_tags').eq('id', session.user.id).limit(1);
            if (profileError || !profileArray.length) { await authClient.auth.signOut(); window.location.href = 'index.html'; return; }
            
            const profile = profileArray[0], tags = profile?.active_tags || [];
            const isAdminUser = profile?.admin === true;

            if (!isAdminUser && !userHasAccess(tags, 'pro')) { window.location.href = 'account.html'; return; }

            const navElements = ['dashboard', 'newsfeed', 'key-levels', 'analysis', 'profile', 'courses', 'admin', 'upload'].reduce((acc, id) => { acc[id] = document.getElementById(`nav-${id}`); return acc; }, {});
            if (navElements.dashboard) navElements.dashboard.style.display = 'block';
            if (navElements.newsfeed) navElements.newsfeed.style.display = 'block';
            if (navElements.keyLevels) navElements.keyLevels.style.display = 'block';
            if (navElements.analysis) navElements.analysis.style.display = 'block';
            if (navElements.profile) navElements.profile.style.display = 'block';
            if (navElements.courses) navElements.courses.style.display = 'block';
            if (isAdminUser && navElements.admin) navElements.admin.style.display = 'block';
            if (isAdminUser && navElements.upload) navElements.upload.style.display = 'block';

            setupTabs();
            await loadData();
        }

        async function loadData() {
            const statusIndicator = document.getElementById('status-indicator');
            const cachedString = localStorage.getItem(CACHE_KEY);
            
            if (cachedString) {
                try {
                    const cacheObj = JSON.parse(cachedString);
                    const ageInMs = Date.now() - cacheObj.savedAt;

                    if (ageInMs < CACHE_LIFESPAN_MS) {
                        renderAllData(cacheObj.data);
                        const dbTimeStr = new Date(cacheObj.dbTimestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        statusIndicator.innerText = `Loaded from Cache | DB Data from: ${dbTimeStr}`;
                        document.getElementById('global-loader').style.display = 'none';
                        return; 
                    }
                } catch (e) { console.warn("Invalid cache found, ignoring."); }
            }

            try {
                statusIndicator.innerText = "Checking database for updates...";
                
                const { data, error } = await dataClient.from('central_bank_rates').select('*');
                if (error) throw error;

                if (data && data.length > 0) {
                    const latestTimestamp = Math.max(...data.map(d => new Date(d.updated_at).getTime()));
                    
                    const newCacheObj = {
                        savedAt: Date.now(),
                        dbTimestamp: latestTimestamp,
                        data: data
                    };
                    localStorage.setItem(CACHE_KEY, JSON.stringify(newCacheObj));

                    renderAllData(data);

                    const timeStr = new Date(latestTimestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    statusIndicator.innerText = `Synced | Data Updated: ${timeStr}`;
                } else {
                    renderEmptyStates("Awaiting initial data sync from the automated background process.");
                    statusIndicator.innerText = "Database Empty";
                }
            } catch (err) {
                console.error("Supabase load error:", err);
                renderEmptyStates("Error connecting to database.");
                statusIndicator.innerText = "Connection Error";
            } finally {
                document.getElementById('global-loader').style.display = 'none';
            }
        }

        function renderAllData(dataArray) {
            globalBankData = dataArray; // Store globally so child tabs can read 'main' overview rates
            dataArray.forEach(item => {
                const config = banksToFetch.find(b => b.id === item.bank_id);
                if (config) { renderBankTab(config, item.rows); }
            });
        }

        function renderEmptyStates(message) {
            banksToFetch.forEach(bank => {
                const container = document.getElementById(`${bank.id}-pane`);
                if (container) container.innerHTML = `<div class="empty-state">${message}</div>`;
            });
        }

        function setupTabs() {
            document.getElementById('mainTabs').addEventListener('click', (e) => {
                const btn = e.target.closest('.tab-btn');
                if (!btn || btn.classList.contains('active-tab')) return;

                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-tab'));
                btn.classList.add('active-tab');

                document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active-pane'));
                const activePane = document.getElementById(`${btn.dataset.tab}-pane`);
                if (activePane) activePane.classList.add('active-pane');
            });
        }

        function renderBankTab(bank, dataRows) {
            if (!dataRows || dataRows.length === 0) return;
            const container = document.getElementById(`${bank.id}-pane`);
            if (!container) return;

            container.innerHTML = '';

            // FILTER: Only use the 'current' dataset for the physical table and summary cards
            // Fallback to dataRows if dataset tagging hasn't populated yet
            let currentData = dataRows.filter(r => r.dataset === 'current');
            if (currentData.length === 0) { currentData = dataRows; }
            
            let currentRate = "0.00%";
            
            if (bank.id !== 'main') {
                const mainData = globalBankData.find(d => d.bank_id === 'main');
                if (mainData && mainData.rows) {
                    const targetNames = {
                        'fed': 'Federal Reserve', 'ecb': 'European Central Bank',
                        'boe': 'Bank of England', 'boj': 'Bank of Japan',
                        'boc': 'Bank of Canada', 'rba': 'Reserve Bank of Australia'
                    };
                    const mainRow = mainData.rows.find(r => r.bank && r.bank.includes(targetNames[bank.id]));
                    if (mainRow) currentRate = mainRow.current;
                }

                // Summary cards now strictly read from currentData, ignoring historical blocks
                const firstMtg = currentData[0] || {};
                const lastMtg = currentData[currentData.length - 1] || {};

                const summaryHTML = `
                <div style="display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;">
                    <div class="bank-card" style="margin-bottom: 0; padding: 15px; flex: 1; min-width: 200px;">
                        <div style="color: #8b949e; font-size: 11px; font-weight: 600; text-transform: uppercase; margin-bottom: 8px;">Next Decision</div>
                        <div style="font-size: 20px; font-weight: 700; color: #fff;">${firstMtg.date || 'N/A'}</div>
                    </div>
                    <div class="bank-card" style="margin-bottom: 0; padding: 15px; flex: 1; min-width: 200px;">
                        <div style="color: #8b949e; font-size: 11px; font-weight: 600; text-transform: uppercase; margin-bottom: 8px;">Next Meeting Pricing</div>
                        <div style="font-size: 20px; font-weight: 700; color: #22c55e;">${firstMtg.prob || 'N/A'}</div>
                        <div style="font-size: 12px; color: #8b949e; margin-top: 4px;">${firstMtg.delta && !firstMtg.delta.includes('-') && !firstMtg.delta.includes('(') ? '+' : ''}${firstMtg.delta || '0'} bps</div>
                    </div>
                    <div class="bank-card" style="margin-bottom: 0; padding: 15px; flex: 1; min-width: 200px;">
                        <div style="color: #8b949e; font-size: 11px; font-weight: 600; text-transform: uppercase; margin-bottom: 8px;">Current Rate</div>
                        <div style="font-size: 20px; font-weight: 700; color: #fff;">${currentRate}</div>
                    </div>
                    <div class="bank-card" style="margin-bottom: 0; padding: 15px; flex: 1; min-width: 200px;">
                        <div style="color: #8b949e; font-size: 11px; font-weight: 600; text-transform: uppercase; margin-bottom: 8px;">12-Month Outlook</div>
                        <div style="font-size: 20px; font-weight: 700; color: #00b4f9;">${lastMtg.delta && !lastMtg.delta.includes('-') && !lastMtg.delta.includes('(') ? '+' : ''}${lastMtg.delta || '0'} bps</div>
                    </div>
                </div>
                `;

                const chartId = `${bank.id}-chart`;
                const chartCard = document.createElement('div');
                chartCard.className = 'bank-card';
                chartCard.innerHTML = `
                    <div class="bank-card-header">
                        <span>IMPLIED RATE PATH (MARKET EXPECTATION)</span>
                        <span class="highlight-blue">${bank.title}</span>
                    </div>
                    <div class="chart-holder">
                        <canvas id="${chartId}"></canvas>
                    </div>
                `;
                
                container.innerHTML = summaryHTML;
                container.appendChild(chartCard);
                // Pass ALL dataRows to the chart so it can plot the comparison lines
                setTimeout(() => reconstructChart(chartId, dataRows, currentRate), 50);
            }

            const tableCard = document.createElement('div');
            tableCard.className = 'bank-card';
            
            let tableHTML = `
                <div class="bank-card-header">
                    <span>${bank.id === 'main' ? 'UPCOMING CENTRAL BANK MEETINGS' : 'MEETING-BY-MEETING RATE PATH'}</span>
                </div>
                <table>
                    <thead>
            `;

            if (bank.id === 'main') {
                tableHTML += `<tr><th>Next Meeting</th><th>Bank</th><th>Current Rate</th><th>Probability</th><th>Hike/Cut</th><th>Δ vs Current (bps)</th></tr></thead><tbody>`;
                currentData.forEach(row => { 
                    tableHTML += `<tr>
                        <td>${row.date}</td>
                        <td class="highlight-blue">${row.bank}</td>
                        <td>${row.current}</td>
                        <td>${row.prob}</td>
                        <td>${row.hike_cut}</td>
                        <td class="highlight-green">${row.delta && !row.delta.includes('-') && !row.delta.includes('(') ? '+'+row.delta : row.delta}</td>
                    </tr>`; 
                });
            } else {
                tableHTML += `<tr><th>Meeting</th><th>Implied Rate (Post-Meeting)</th><th>Δ vs Current (bps)</th><th># of Hikes(Cuts)</th><th>Probability of Hike(Cut)</th></tr></thead><tbody>`;
                currentData.forEach(row => { 
                    tableHTML += `<tr>
                        <td>${row.date}</td>
                        <td class="highlight-blue">${row.implied}</td>
                        <td class="highlight-green">${row.delta && !row.delta.includes('-') && !row.delta.includes('(') ? '+'+row.delta : row.delta}</td>
                        <td>${row.hikes}</td>
                        <td>${row.prob}</td>
                    </tr>`; 
                });
            }

            tableHTML += `</tbody></table>`;
            tableCard.innerHTML = tableHTML;
            container.appendChild(tableCard);
        }

        function reconstructChart(chartId, dataRows, currentRateStr) {
            const canvas = document.getElementById(chartId);
            if (!canvas) return;
            if (chartInstances[chartId]) { chartInstances[chartId].destroy(); }

            // Extract datasets safely
            let currentData = dataRows.filter(r => r.dataset === 'current');
            if (currentData.length === 0) { currentData = dataRows; } // Fallback
            const w1Data = dataRows.filter(r => r.dataset === '1w_ago');

            const dates = ['Current', ...currentData.map(row => row.date)];
            
            let currentVal = parseFloat(currentRateStr.replace('%', ''));
            if (isNaN(currentVal)) currentVal = parseFloat(currentData[0]?.implied.replace('%', '')) || 0;

            const currentRates = [currentVal, ...currentData.map(row => parseFloat(row.implied?.replace('%', '')) || 0)];
            const w1Rates = w1Data.length > 0 ? [currentVal, ...w1Data.map(row => parseFloat(row.implied?.replace('%', '')) || 0)] : [];

            const datasets = [{
                label: 'Current Pricing',
                data: currentRates,
                borderColor: '#00b4f9',
                backgroundColor: 'rgba(0, 180, 249, 0.08)',
                borderWidth: 2,
                fill: true,
                tension: 0.25,
                pointBackgroundColor: '#0d1117',
                pointBorderColor: '#00b4f9',
                pointBorderWidth: 2,
                pointRadius: 4
            }];

            // Plot 1 week ago comparison line if data exists in Supabase
            if (w1Rates.length > 0) {
                datasets.push({
                    label: '1 Week Ago',
                    data: w1Rates,
                    borderColor: '#8b949e',
                    backgroundColor: 'transparent',
                    borderWidth: 2,
                    borderDash: [5, 5],
                    fill: false,
                    tension: 0.25,
                    pointBackgroundColor: '#0d1117',
                    pointBorderColor: '#8b949e',
                    pointBorderWidth: 2,
                    pointRadius: 3
                });
            }

            const ctx = canvas.getContext('2d');
            chartInstances[chartId] = new Chart(ctx, {
                type: 'line',
                data: { labels: dates, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        y: { 
                            title: { display: true, text: 'Implied Rate (%)', color: '#8b949e', font: { family: 'Inter', size: 10 } },
                            grid: { color: 'rgba(28, 34, 48, 0.6)' },
                            ticks: { color: '#c9d1d9', callback: v => v.toFixed(2) + '%', font: { family: 'JetBrains Mono', size: 10 } }
                        },
                        x: { 
                            grid: { display: false },
                            ticks: { color: '#8b949e', font: { family: 'JetBrains Mono', size: 10 }, maxRotation: 45 }
                        }
                    },
                    plugins: {
                        legend: { display: true, labels: { color: '#c9d1d9', font: { family: 'Inter', size: 11 } } },
                        tooltip: { 
                            padding: 10,
                            callbacks: { label: context => ` ${context.dataset.label}: ${context.parsed.y.toFixed(2)}%` }
                        }
                    }
                }
            });
        }

        function toggleNav() { document.getElementById("navLinks").classList.toggle("active-nav"); }
        function toggleDropdown(event) { event.stopPropagation(); document.getElementById("settingsDropdown").style.display = (document.getElementById("settingsDropdown").style.display === "block" ? "none" : "block"); }
        window.onclick = function(event) { if (!event.target.matches('.dropbtn')) { document.querySelectorAll('.dropdown-content').forEach(d => d.style.display = 'none'); } };
        document.getElementById('logoutBtn').addEventListener('click', async () => { await authClient.auth.signOut(); window.location.href = 'index.html'; });

        window.onload = init;
    </script>
</body>
</html>
