        function parseBps(str) {
            if (!str) return 0;
            let clean = String(str).replace(/[^\d.-]/g, '');
            if (String(str).includes('(')) clean = '-' + clean;
            return parseFloat(clean) || 0;
        }

        function getCorrectedRow(row) {
            if (!row) return {};
            let probStr = row.prob || '';
            let deltaStr = row.delta || '';
            if (String(deltaStr).includes('%') && !String(probStr).includes('%')) {
                return { ...row, prob: deltaStr, delta: probStr };
            }
            return row;
        }

        function userHasAccess(userTags, requiredTag) {
            if (!userTags) return false;
            let tagsArray = Array.isArray(userTags) ? userTags : [];
            if (typeof userTags === 'string') { 
                try { let parsed = JSON.parse(userTags); tagsArray = Array.isArray(parsed) ? parsed : [userTags]; } 
                catch (e) { tagsArray = userTags.split(',').map(s => s.trim()); } 
            }
            return tagsArray.some(tag => String(tag).toLowerCase() === requiredTag.toLowerCase());
        }

        async function init() {

            const navElements = ['dashboard', 'newsfeed', 'key-levels', 'analysis', 'profile', 'courses', 'admin', 'upload'].reduce((acc, id) => { acc[id] = document.getElementById(`nav-${id}`); return acc; }, {});

            if (navElements.profile) navElements.profile.style.display = 'block';
            if (navElements.courses) navElements.courses.style.display = 'block';
            if (isAdminUser && navElements.admin) navElements.admin.style.display = 'block';
            if (isAdminUser && navElements.upload) navElements.upload.style.display = 'block';

            setupTabs();
            await loadData();
        }

        async function loadData() {
            const statusIndicator = document.getElementById('status-indicator');
            const cachedString = localStorage.getItem(CACHE_KEY);
            let cacheObj = null;
            
            if (cachedString) {
                try { cacheObj = JSON.parse(cachedString); } catch (e) {}
            }

            try {
                statusIndicator.innerText = "Checking database for updates...";
                
                const { data: latestRow, error: timeError } = await dataClient
                    .from('central_bank_rates')
                    .select('updated_at')
                    .order('updated_at', { ascending: false })
                    .limit(1);
                    
                if (timeError) throw timeError;
                
                let dbIsNewer = false;
                let latestDbTime = 0;
                
                if (latestRow && latestRow.length > 0) {
                    latestDbTime = new Date(latestRow[0].updated_at).getTime();
                    if (!cacheObj || latestDbTime > cacheObj.dbTimestamp) {
                        dbIsNewer = true;
                    }
                }

                if (cacheObj && !dbIsNewer) {
                    renderAllData(cacheObj.data);
                    const dbTimeStr = new Date(cacheObj.dbTimestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    statusIndicator.innerText = `Loaded from Cache | DB Data from: ${dbTimeStr}`;
                    document.getElementById('global-loader').style.display = 'none';
                    return; 
                }

                statusIndicator.innerText = "Downloading fresh market data...";
                const { data, error } = await dataClient.from('central_bank_rates').select('*');
                if (error) throw error;

                if (data && data.length > 0) {
                    const groupedData = {};
                    
                    data.forEach(item => {
                        if (!groupedData[item.bank_id]) groupedData[item.bank_id] = [];
                        let parsedRows = item.rows;
                        if (typeof parsedRows === 'string') {
                            try { parsedRows = JSON.parse(parsedRows); } catch(e) {}
                        }
                        groupedData[item.bank_id].push({ ...item, rows: parsedRows || [] });
                    });

                    Object.keys(groupedData).forEach(bankId => {
                        groupedData[bankId].sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
                    });

                    localStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), dbTimestamp: latestDbTime, data: groupedData }));
                    renderAllData(groupedData);
                    statusIndicator.innerText = `Synced | Data Updated: ${new Date(latestDbTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
                } else {
                    renderEmptyStates("Awaiting initial data sync from the automated background process.");
                    statusIndicator.innerText = "Database Empty";
                }
            } catch (err) {
                renderEmptyStates("Error connecting to database.");
                statusIndicator.innerText = "Connection Error";
            } finally {
                document.getElementById('global-loader').style.display = 'none';
            }
        }

        function startCountdowns() {
            if (countdownTimerId) clearInterval(countdownTimerId);
            countdownTimerId = setInterval(() => {
                document.querySelectorAll('.countdown-timer').forEach(el => {
                    const dateStr = el.getAttribute('data-date');
                    if (!dateStr || dateStr === 'N/A') return;
                    
                    let targetDate = new Date(dateStr + " 14:00:00 EDT").getTime();
                    if (isNaN(targetDate)) {
                        targetDate = new Date(dateStr).getTime() + (14 * 60 * 60 * 1000); 
                    }

                    const now = new Date().getTime();
                    const diff = targetDate - now;

                    if (diff < 0) {
                        el.innerHTML = "Meeting Started";
                        return;
                    }

                    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((diff % (1000 * 60)) / 1000);

                    el.innerHTML = `${d}d ${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                });
            }, 1000);
        }

        function renderAllData(groupedData) {
            globalGroupedSnapshots = groupedData; 
            banksToFetch.forEach(bank => {
                const bankSnapshots = groupedData[bank.id] || [];
                renderBankTab(bank, bankSnapshots);
            });
            drawOverviewCharts();
            startCountdowns();
        }

        function renderEmptyStates(message) {
            banksToFetch.forEach(bank => {
                const container = document.getElementById(`${bank.id}-pane`);
                if (container) container.innerHTML = `<div class="empty-state">${message}</div>`;
            });
        }

        function setupTabs() {
            document.getElementById('mainTabs').addEventListener('click', (e) => {
                const btn = e.target.closest('.tab-btn');
                if (!btn || btn.classList.contains('active-tab')) return;

                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-tab'));
                btn.classList.add('active-tab');

                document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active-pane'));
                const activePane = document.getElementById(`${btn.dataset.tab}-pane`);
                if (activePane) {
                    activePane.classList.add('active-pane');
                    setTimeout(() => {
                        for (let key in chartInstances) {

        function calculateQuarterlyMatrix(currentData) {
            const quarters = {};
            currentData.forEach(r => {
                const row = getCorrectedRow(r);
                if (!row.date) return;
                const d = new Date(row.date);
                if (isNaN(d.getTime())) return;
                
                const qKey = `Q${Math.floor(d.getMonth() / 3) + 1} ${d.getFullYear()}`;
                const deltaVal = parseBps(row.delta);
                quarters[qKey] = deltaVal; 
            });

            let html = `<div class="quarter-matrix">`;
            const keys = Object.keys(quarters);
            if (keys.length === 0) return '';

            keys.forEach(q => {
                const val = quarters[q];
                const color = val > 0 ? '#22c55e' : (val < 0 ? '#ef4444' : '#8b949e');
                const str = (val > 0 ? '+' : '') + val.toFixed(1) + ' bps';
                html += `
                    <div class="quarter-chip">
                        <div class="quarter-lbl">${q}</div>
                        <div class="quarter-val" style="color: ${color};">${str}</div>
                    </div>
                `;
            });
            html += `</div>`;
            return html;
        }

        function generateMatrixHTML(id, ratesObj) {
            const currencies = ['USD', 'EUR', 'GBP', 'CAD', 'AUD', 'JPY'];
            let html = `<table id="${id}" class="matrix-table" style="display: ${id==='matrix-current'?'table':'none'}; border-collapse: separate; border-spacing: 0;"><thead><tr><th style="border:none;"></th>`;
            currencies.forEach(c => html += `<th style="color:#8b949e; border:none; padding-bottom:15px;">${c}</th>`);
            html += `</tr></thead><tbody>`;
            
            let maxSpread = 0;
            currencies.forEach(r => currencies.forEach(c => {
                if(r !== c) maxSpread = Math.max(maxSpread, Math.abs(ratesObj[r] - ratesObj[c]));
            }));
            
            currencies.forEach(rowCur => {
                html += `<tr><td style="color:#8b949e; border:none; padding-right:15px;">${rowCur}</td>`;
                currencies.forEach(colCur => {
                    if (rowCur === colCur) {
                        html += `<td style="background: rgba(255,255,255,0.02); text-align:center;">-</td>`;
                    } else {
                        let spread = (ratesObj[rowCur] - ratesObj[colCur]) * 100;
                        let val = Math.round(spread);
                        let opacity = Math.min(Math.abs(val) / (maxSpread * 100 || 1), 1) * 0.4 + 0.15; 
                        let color = val >= 0 ? `rgba(34, 197, 94, ${opacity})` : `rgba(239, 68, 68, ${opacity})`;
                        let text = val >= 0 ? `+${val}` : val;
                        html += `<td style="background: ${color}; text-align:center; color:${val>=0?'#4ade80':'#f87171'};">${text}</td>`;
                    }
                });
                html += `</tr>`;
            });
            html += `</tbody></table>`;
            return html;
        }

                        <div style="color: #8b949e; font-size: 11px; font-weight: 600; text-transform: uppercase;">7-Day Velocity</div>

                `;

                const chartId = `${bank.id}-chart`;
                const barChartId = `${bank.id}-bar-chart`;
                
                const toggleButtonsHTML = `
                    <button class="ds-btn active-toggle" onclick="toggleDatasetByLabel('${chartId}', 'Current', this)">Current</button>
                    <button class="ds-btn active-toggle" onclick="toggleDatasetByLabel('${chartId}', '1w ago', this)">1w ago</button>
                    <button class="ds-btn active-toggle" onclick="toggleDatasetByLabel('${chartId}', '3w ago', this)">3w ago</button>

                `;

                const chartsWrapper = document.createElement('div');
                chartsWrapper.style.display = 'flex';
                chartsWrapper.style.gap = '20px';
                chartsWrapper.style.flexWrap = 'wrap';
                
                chartsWrapper.innerHTML = `
                    <div class="bank-card" style="flex: 1; min-width: 320px; margin-bottom: 20px; display: flex; flex-direction: column;">
                        <div class="bank-card-header" style="border-bottom: none;">
                            <span>IMPLIED RATE PATH (MARKET EXPECTATION)</span>
                            <span class="highlight-blue">${bank.title}</span>

                        <div style="display:flex; gap:8px; padding:0 20px 12px 20px; background:#161b22; border-bottom:1px solid #1c2230;">

                            <canvas id="${chartId}"></canvas>

                    </div>
                    <div class="bank-card" style="flex: 1.2; min-width: 320px; margin-bottom: 20px; display: flex; flex-direction: column;">
                        <div class="bank-card-header">
                            <span>IMPLIED POINTS (BPS)</span>

                container.innerHTML = summaryHTML;
                container.appendChild(chartsWrapper);
                
                setTimeout(() => reconstructIndividualChart(chartId, barChartId, snapshots, currentRate), 50);
            }

            const tableCard = document.createElement('div');
            tableCard.className = 'bank-card';
            
            if (bank.id === 'main') {
                let tableHTML = `<div class="bank-card-header"><span>UPCOMING CENTRAL BANK MEETINGS</span></div><table><thead>`;
                tableHTML += `<tr><th>Next Meeting</th><th>Bank</th><th>Current Rate</th><th>Probability</th><th>Hike/Cut</th><th>Δ vs Current (bps)</th><th>Implied Outcome</th><th>12-Month Outlook (bps)</th></tr></thead><tbody>`;
                currentData.forEach(r => { 
                    const row = getCorrectedRow(r);
                    let outcomeColor = '#8b949e';
                    const ocText = (row.implied_outcome || '').toUpperCase();
                    if (ocText === 'HIKE') outcomeColor = '#22c55e';
                    if (ocText === 'CUT') outcomeColor = '#ef4444';

                    tableHTML += `<tr>
                        <td>${row.date}</td>
                        <td class="highlight-blue">${row.bank}</td>
                        <td>${row.current}</td>
                        <td>${row.prob}</td>
                        <td>${row.hike_cut}</td>
                        <td class="highlight-green">${parseBps(row.delta) > 0 ? '+'+row.delta : row.delta}</td>
                        <td style="color: ${outcomeColor}; font-weight: 600;">${ocText}</td>
                        <td>${row.outlook || ''}</td>
                    </tr>`; 
                });
                tableHTML += `</tbody></table>`;
                tableCard.innerHTML = tableHTML;
            } else {
                let tableHTML = `<div class="bank-card-header"><span>MEETING-BY-MEETING RATE PATH</span></div><table><thead>`;
                tableHTML += `<tr><th>Meeting</th><th>Implied Rate (Post-Meeting)</th><th>Probability of Hike(Cut)</th><th># of Hikes(Cuts)</th><th>Δ vs Current (bps)</th></tr></thead><tbody>`;
                currentData.forEach(r => { 
                    const row = getCorrectedRow(r);
                    tableHTML += `<tr>
                        <td>${row.date}</td>
                        <td class="highlight-blue">${row.implied}</td>
                        <td>${row.prob}</td>
                        <td>${row.hikes}</td>
                        <td class="highlight-green">${parseBps(row.delta) > 0 ? '+'+row.delta : row.delta}</td>
                    </tr>`; 
                });
                tableHTML += `</tbody></table>`;
                tableCard.innerHTML = tableHTML;
            }
            container.appendChild(tableCard);

            const guideCard = document.createElement('div');
            guideCard.className = 'guide-box';
            guideCard.innerHTML = `
                <div class="guide-header">
                    <span>📘 Master Guide & Trading Playbook: ${bank.title}</span>
                </div>
                <div style="font-size: 14px; color: #c9d1d9; font-weight: 600; margin-bottom: 6px; margin-top: 10px;">Macro Profile: ${macro.role}</div>
                <div style="font-size: 13px; color: #8b949e; margin-bottom: 18px; line-height: 1.6;">${macro.focus} ${macro.impact}</div>
                
                <div style="border-top: 1px solid #1c2230; padding-top: 16px; margin-top: 8px;">
                    <span style="font-size: 13px; font-weight: 600; color: #e2e8f0; text-transform: uppercase; letter-spacing: 0.5px;">How to Trade the Dashboard Data</span>
                </div>

                <div class="guide-grid">
                    <div class="guide-card">
                        <div class="guide-title">1. Next Meeting Pricing Edge</div>
                        <div class="guide-desc">
                            Don't just look at the percentage—trade the gap against consensus. A probability <strong>below 60%</strong> means the market is highly uncertain, making the meeting a massive volatility event. If it sits <strong>above 80%</strong>, the decision is fully priced in, meaning the real market reaction will come strictly from the press conference tone (forward guidance), not the rate decision itself.
                        </div>
                    </div>
                    <div class="guide-card">
                        <div class="guide-title">2. Cycle Peak (Terminal Rate)</div>
                        <div class="guide-desc">
                            This is the most important structural indicator. It tells you the exact ceiling (or floor) the market believes policy will reach. <strong>Trade Signal:</strong> If the Cycle Peak shifts higher by +25bps after an inflation report, it provides a strong structural tailwind to buy the domestic currency, even if short-term rates don't move immediately.
                        </div>
                    </div>
                    <div class="guide-card">
                        <div class="guide-title">3. 7-Day Repricing Velocity</div>
                        <div class="guide-desc">
                            Markets are driven by the <em>rate of change</em>, not the absolute level. The 7-Day Velocity strips away the noise and shows pure momentum. <strong>Trade Signal:</strong> A rapid hawkish shift (e.g., +15 bps in a week) indicates bond traders are panic-pricing new, hot economic data. Follow the momentum until the velocity stabilizes back near 0.0 bps.
                        </div>
                    </div>
                    <div class="guide-card">
                        <div class="guide-title">4. 12M FX Spread vs USD</div>
                        <div class="guide-desc">
                            Currencies are fundamentally driven by yield differentials (the Carry Trade). This metric calculates the forward 1-year premium of holding this currency vs the US Dollar. <strong>Trade Signal:</strong> As this spread widens into the positive (green), institutional capital will flow heavily into the domestic currency, establishing strong, multi-month uptrends against the USD.
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(guideCard);
        }

        function drawOverviewCharts() {
            const relCanvas = document.getElementById('main-relative-chart');
            const lvlCanvas = document.getElementById('main-level-chart');
            if (!relCanvas || !lvlCanvas) return;

            if (chartInstances['main-relative-chart']) chartInstances['main-relative-chart'].destroy();
            if (chartInstances['main-level-chart']) chartInstances['main-level-chart'].destroy();

            const fedSnapshots = globalGroupedSnapshots['fed'] || [];
            if (fedSnapshots.length === 0) return;
            
            const fedCurrent = fedSnapshots[0].rows.filter(r => r.dataset === 'current');
            const dates = ['Current', ...fedCurrent.map(row => row.date)];

            const relDatasets = [];
            const lvlDatasets = [];
            
            const colors = { 'fed': '#00b4f9', 'ecb': '#ec4899', 'boe': '#ef4444', 'boj': '#eab308', 'boc': '#8b5cf6', 'rba': '#10b981' };
            const names = { 'fed': 'FED', 'ecb': 'ECB', 'boe': 'BOE', 'boj': 'BOJ', 'boc': 'BOC', 'rba': 'RBA' };

            ['fed', 'ecb', 'boe', 'boj', 'boc', 'rba'].forEach(bankId => {
                const bankSnapshots = globalGroupedSnapshots[bankId] || [];
                if (bankSnapshots.length > 0) {
                    const bData = bankSnapshots[0].rows.filter(r => r.dataset === 'current').map(r => getCorrectedRow(r));
                    const deltas = [0, ...bData.map(row => parseBps(row.delta))];
                    
                    let currentRate = 0;
                    const mainSnapshots = globalGroupedSnapshots['main'] || [];
                    if (mainSnapshots.length > 0) {
                        const targetNames = { 'fed': 'Federal Reserve', 'ecb': 'European Central Bank', 'boe': 'Bank of England', 'boj': 'Bank of Japan', 'boc': 'Bank of Canada', 'rba': 'Reserve Bank of Australia' };
                        const mainRow = mainSnapshots[0].rows.find(r => r.bank && r.bank.includes(targetNames[bankId]));
                        if (mainRow) currentRate = parseFloat(String(mainRow.current).replace('%', '')) || 0;
                    }
                    const levels = [currentRate, ...bData.map(row => parseFloat(String(row.implied).replace('%', '')) || 0)];

                    relDatasets.push({
                        label: names[bankId], 
                        borderColor: colors[bankId], 
                        backgroundColor: 'transparent', 
                        borderWidth: 2, 
                        tension: 0.3, 
                        pointRadius: 2, 
                        pointHoverRadius: 5, 
                        data: deltas 
                    });

                    lvlDatasets.push({ 
                        label: names[bankId], 
                        borderColor: colors[bankId], 
                        backgroundColor: 'transparent', 
                        borderWidth: 2, 
                        tension: 0.3, 
                        pointRadius: 2, 
                        pointHoverRadius: 5, 
                        data: levels 
                    });
                }
            });

            const commonOptions = {
                responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
                plugins: { legend: { position: 'top', labels: { color: '#c9d1d9', boxWidth: 12, font: {family: 'Inter'} } } },
                scales: { x: { grid: { display: false }, ticks: { color: '#8b949e', font: {family: 'JetBrains Mono', size: 10}, maxRotation: 45 } } }
            };

            const relCtx = relCanvas.getContext('2d');
            chartInstances['main-relative-chart'] = new Chart(relCtx, {
                type: 'line',
                data: { labels: dates, datasets: relDatasets },
                options: { ...commonOptions, scales: { ...commonOptions.scales, y: { title: { display: true, text: 'Δ vs Current (bps)', color: '#8b949e' }, grid: { color: 'rgba(28, 34, 48, 0.6)' }, ticks: { color: '#c9d1d9' } } } }
            });

            const lvlCtx = lvlCanvas.getContext('2d');
            chartInstances['main-level-chart'] = new Chart(lvlCtx, {
                type: 'line',
                data: { labels: dates, datasets: lvlDatasets },
                options: { ...commonOptions, scales: { ...commonOptions.scales, y: { title: { display: true, text: 'Policy Rate (%)', color: '#8b949e' }, grid: { color: 'rgba(28, 34, 48, 0.6)' }, ticks: { color: '#c9d1d9', callback: v => v.toFixed(2) + '%' } } } }
            });
        }

        function getHistoricalSnapshot(snapshots, targetDaysAgo) {
            if (!snapshots || snapshots.length <= 1) return null;
            const nowMs = new Date(snapshots[0].updated_at).getTime();
            const targetMs = nowMs - (targetDaysAgo * 24 * 60 * 60 * 1000);
            
            let closest = null;
            let minDiff = Infinity;
            
            for (let i = 1; i < snapshots.length; i++) {
                const rowMs = new Date(snapshots[i].updated_at).getTime();
                const diff = Math.abs(rowMs - targetMs);
                if (diff < minDiff && diff <= (2 * 24 * 60 * 60 * 1000)) {
                    minDiff = diff;
                    closest = snapshots[i];
                }
            }
            return closest;
        }

        function reconstructIndividualChart(chartId, barChartId, bankSnapshots, currentRateStr) {
            const canvas = document.getElementById(chartId);
            const barCanvas = document.getElementById(barChartId);
            if (!canvas || !barCanvas) return;
            
            if (chartInstances[chartId]) chartInstances[chartId].destroy();
            if (chartInstances[barChartId]) chartInstances[barChartId].destroy();

            const dsConfigs = [
                { label: 'Current', color: '#00b4f9', daysAgo: 0 },
                { label: '1w ago', color: '#a8a29e', daysAgo: 7 },
                { label: '3w ago', color: '#fbbf24', daysAgo: 21 },
                { label: '6w ago', color: '#94a3b8', daysAgo: 42 },
                { label: '10w ago', color: '#e2e8f0', daysAgo: 70 }
            ];

            const currentSnapshot = bankSnapshots[0];
            const currentRows = currentSnapshot.rows.map(r => getCorrectedRow(r));
            const meetingDates = currentRows.map(row => row.date);
            const xLabels = ['Current', ...meetingDates];
            
            let currentVal = parseFloat(String(currentRateStr).replace('%', ''));
            if (isNaN(currentVal)) currentVal = parseFloat(String(currentRows[0]?.implied || '').replace('%', '')) || 0;

            const datasets = [];

            dsConfigs.forEach((config) => {
                let targetSnapshot = null;
                
                if (config.daysAgo === 0) {
                    targetSnapshot = currentSnapshot;
                } else {
                    targetSnapshot = getHistoricalSnapshot(bankSnapshots, config.daysAgo);
                }

                if (config.daysAgo === 0) {
                    const plotRates = [currentVal, ...currentRows.map(row => parseFloat(String(row.implied || '').replace('%', '')) || 0)];
                    datasets.push({
                        label: config.label,
                        data: plotRates,
                        borderColor: config.color,
                        backgroundColor: 'rgba(0, 180, 249, 0.05)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.25,
                        pointBackgroundColor: '#0d1117',
                        pointBorderColor: config.color,
                        pointBorderWidth: 2,
                        pointRadius: 3,
                        pointHoverRadius: 6
                    });
                } else {
                    const historicalRows = targetSnapshot ? targetSnapshot.rows.map(r => getCorrectedRow(r)) : [];
                    
                    const plotRates = xLabels.map((xLabel, idx) => {
                        if (idx === 0) return null;
                        const matchedRow = historicalRows.find(r => r.date && r.date.trim().toLowerCase() === xLabel.trim().toLowerCase());
                        if (matchedRow && matchedRow.implied) {
                            const val = parseFloat(String(matchedRow.implied).replace('%', ''));
                            return isNaN(val) ? null : val;
                        }
                        return null;
                    });

                    const hasData = plotRates.some(v => v !== null);

                    datasets.push({
                        label: config.label,
                        data: plotRates,
                        borderColor: config.color,
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        fill: false,
                        tension: 0.25,
                        spanGaps: true,
                        hidden: !hasData, 
                        pointBackgroundColor: '#0d1117',
                        pointBorderColor: config.color,
                        pointBorderWidth: 2,
                        pointRadius: 3,
                        pointHoverRadius: 6
                    });
                }
            });

            const ctx = canvas.getContext('2d');
            chartInstances[chartId] = new Chart(ctx, {
                type: 'line',
                data: { labels: xLabels, datasets: datasets },
                options: {
                    responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
                    scales: {
                        y: { title: { display: true, text: 'Implied Rate (%)', color: '#8b949e', font: {family: 'Inter', size: 10} }, grid: { color: 'rgba(28, 34, 48, 0.6)' }, ticks: { color: '#c9d1d9', callback: v => v.toFixed(2) + '%', font: {family: 'JetBrains Mono', size: 10} } },
                        x: { grid: { display: false }, ticks: { color: '#8b949e', font: {family: 'JetBrains Mono', size: 10}, maxRotation: 45 } }
                    },
                    plugins: { 
                        legend: { display: false }, 
                        tooltip: { padding: 10, callbacks: { label: context => context.parsed.y !== null ? ` ${context.dataset.label}: ${context.parsed.y.toFixed(2)}%` : '' } } 
                    }
                }
            });

            const barCtx = barCanvas.getContext('2d');
            const deltas = currentRows.map(row => parseBps(row.delta));
            
            chartInstances[barChartId] = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: meetingDates,
                    datasets: [{
                        label: 'Implied Points',
                        data: deltas,
                        backgroundColor: '#00b4f9', 
                        borderRadius: 4,
                        barPercentage: 0.6
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false }, 
                        tooltip: { padding: 10, callbacks: { label: ctx => ` ${ctx.parsed.y.toFixed(1)} bps` } } 
                    },
                    scales: {
                        y: { grid: { color: 'rgba(28, 34, 48, 0.6)', borderDash: [5, 5] }, ticks: { color: '#8b949e', callback: v => v.toFixed(1) + ' bps', font: {family: 'JetBrains Mono', size: 10} } },
                        x: { grid: { display: false }, ticks: { color: '#8b949e', font: {family: 'JetBrains Mono', size: 10}, maxRotation: 45 } }
                    }
                }
            });
        }

        function toggleNav() { document.getElementById("navLinks").classList.toggle("active-nav"); }
        function toggleDropdown(event) { event.stopPropagation(); document.getElementById("settingsDropdown").style.display = (document.getElementById("settingsDropdown").style.display === "block" ? "none" : "block"); }
        window.onclick = function(event) { if (!event.target.matches('.dropbtn')) { document.querySelectorAll('.dropdown-content').forEach(d => d.style.display = 'none'); } };
        document.getElementById('logoutBtn').addEventListener('click', async () => { await authClient.auth.signOut(); window.location.href = 'index.html'; });

        window.onload = init;
    </script>
