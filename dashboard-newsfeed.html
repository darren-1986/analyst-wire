<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="media/favicon.png">
    <title>LiveSquawk Premium Feed Widget</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="https://www.livesquawk.com/partner_messenger/css/partner_messenger.css">
    
    <style>
        /* Modern typography import */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        /* Force box-sizing to prevent overflow/alignment issues */
        *, *:before, *:after { box-sizing: border-box; }
        
        body, .messenger__outer { transition: background 0.3s, color 0.3s; }
        body.dark, .dark .messenger__outer { background-color: #0A0A0a !important; color: #ffffff !important; }
        body.light, .light .messenger__outer { background-color: #ffffff !important; color: #000000 !important; }
        body.dark .messenger__outer, .dark .messenger__outer * { color: #e2e8f0 !important; }

        /* Newsfeed Content Styles - Compacted for Widget */
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; }
        .messenger__outer { flex-grow: 1; overflow: hidden; }
        .messenger__outer .newsfeed__title { display: none !important; }
        
        .controls { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; padding: 8px 12px; background: #0A0A0a; border-bottom: 1px solid #1c2230; gap: 10px; }
        
        .left-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        
        .filter-btn { padding: 4px 8px; cursor: pointer; border-radius: 4px; border: 1px solid #475569; background: #1e293b; color: white; font-size: 11px; transition: 0.2s; }
        .filter-btn:hover { background: #334155; }
        .filter-btn.active { background: #00b4f9; border-color: #00b4f9; }
        
        #searchBar { padding: 4px 8px; border-radius: 4px; border: 1px solid #475569; transition: all 0.3s ease; width: 140px; font-size: 11px; background: #1e293b; color: white; }
        #searchBar:focus { outline: none; border-color: #00b4f9; }
        
        #mobileFilter { display: none; padding: 4px 8px; border-radius: 4px; border: 1px solid #475569; background: #1e293b; color: white; outline: none; cursor: pointer; font-size: 11px; }

        .audio-container { display: flex; align-items: center; gap: 12px; }
        /* Slightly increased image size */
        .audio-container img { height: 26px; width: auto; }
        .audio-wrapper { display: flex; align-items: center; gap: 10px; border: 1px solid #00b4f9; padding: 4px 10px; border-radius: 6px; background: #0A0A0a; }
        #audioToggle { cursor: pointer; background: none; border: none; color: #f8fafc; font-weight: 500; display: flex; align-items: center; gap: 6px; min-width: 140px; font-size: 11px; padding: 0; }
        .status-on { color: #22c55e !important; }

        .vol-slider { -webkit-appearance: none; width: 60px; height: 4px; background: #334155; border-radius: 2px; outline: none; }
        .vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: #00b4f9; border-radius: 50%; cursor: pointer; transition: background 0.2s; }
        .vol-slider::-webkit-slider-thumb:hover { background: #ffffff; }

        .switch { position: relative; display: inline-block; width: 40px; height: 20px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: "🌙"; font-size: 10px; display: flex; align-items: center; justify-content: center; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #00b4f9; }
        input:checked + .slider:before { transform: translateX(20px); content: "☀️"; }

        /* --- MOBILE RESPONSIVE STYLES --- */
        @media (max-width: 850px) {
            .filter-btn { display: none; }
            #mobileFilter { display: block; }
            
            .controls { justify-content: flex-start; }
            .audio-container { width: 100%; justify-content: space-between; order: -1; margin-bottom: 5px; }
            #audioToggle { min-width: auto; }
            
            /* Expandable Search Bar */
            #searchBar {
                width: 32px;
                padding: 4px;
                color: transparent;
                cursor: pointer;
                background: #1e293b url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="%23ffffff" class="bi bi-search" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/></svg>') no-repeat center;
            }
            #searchBar::placeholder { color: transparent; }
            #searchBar:focus {
                width: 120px;
                background-image: none;
                color: white;
                cursor: text;
                padding-left: 8px;
            }
            #searchBar:focus::placeholder { color: #94a3b8; }
        }
    </style>
</head>
<body class="dark">

    <div class="controls">
        <div class="left-group">
            <input type="text" id="searchBar" placeholder="Search keywords..." onkeyup="filterFeed()">
            
            <!-- Mobile Dropdown Filter -->
            <select id="mobileFilter" onchange="setFilter(this.value)">
                <option value="all">All</option>
                <option value="commodities">Commodities</option>
                <option value="forex">Forex</option>
                <option value="equities">Equities</option>
                <option value="crypto">Crypto</option>
                <option value="centralBanks">Central Banks</option>
            </select>

            <!-- Desktop Filter Buttons -->
            <button class="filter-btn active" data-type="all" onclick="setFilter('all')">All</button>
            <button class="filter-btn" data-type="commodities" onclick="setFilter('commodities')">Commodities</button>
            <button class="filter-btn" data-type="forex" onclick="setFilter('forex')">Forex</button>
            <button class="filter-btn" data-type="equities" onclick="setFilter('equities')">Equities</button>
            <button class="filter-btn" data-type="crypto" onclick="setFilter('crypto')">Crypto</button>
            <button class="filter-btn" data-type="centralBanks" onclick="setFilter('centralBanks')">Central Banks</button>
            
            <label class="switch">
                <input type="checkbox" id="themeToggle" checked>
                <span class="slider"></span>
            </label>
        </div>

        <div class="audio-container">
            <img src="media/squawkimage.png" alt="Logo" />
            <div class="audio-wrapper">
                <button id="audioToggle" onclick="handleAudioToggle()">🔊 <span id="audioLabel">Disconnected</span> <span id="timerText"></span></button>
                <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.1" value="1" title="Volume">
            </div>
        </div>
    </div>

    <div class="messenger__outer" id="livesquawk_messenger_outer"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // --- HELPER FUNCTION: Bulletproof parsing for Arrays, Strings, and JSON ---
        function userHasAccess(userTags, requiredTag) {
            if (!userTags) return false;
            
            let tagsArray = [];
            
            if (Array.isArray(userTags)) {
                tagsArray = userTags;
            } else if (typeof userTags === 'string') {
                try {
                    let parsed = JSON.parse(userTags);
                    tagsArray = Array.isArray(parsed) ? parsed : [userTags];
                } catch (e) {
                    tagsArray = userTags.split(',').map(s => s.trim());
                }
            }

            return tagsArray.some(tag => String(tag).toLowerCase() === requiredTag.toLowerCase());
        }

        // --- AUTH & PERMISSION CHECK ---
        const client = supabase.createClient('https://fgidelsazisdqjfckerd.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnaWRlbHNhemlzZHFqZmNrZXJkIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4Mjk0NzU4NCwiZXhwIjoyMDk4NTIzNTg0fQ.2UkKkgfJ6oERQrp2VOtiL9YP2MXKVWARAdoEkB5YJbY');

        async function init() {
            // 1. Session check
            const { data: { session } } = await client.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            
            // 2. Fetch Profile Using Updated Schema
            const { data: profileArray, error: profileError } = await client
                .from('profiles')
                .select('admin, active_tags')
                .eq('id', session.user.id)
                .limit(1);
                
            if (profileError) {
                alert("Database Error: " + profileError.message);
                await client.auth.signOut();
                window.location.href = 'index.html';
                return;
            }
            
            const profile = profileArray && profileArray.length > 0 ? profileArray[0] : null;
            const tags = profile?.active_tags ? profile.active_tags : [];
            const isAdmin = profile?.admin === true;

            if (!profile || tags.length === 0 || userHasAccess(tags, 'free')) {
                alert("Your subscription is inactive. Redirecting to login.");
                await client.auth.signOut();
                window.location.href = 'index.html';
                return;
            }

            // 3. HARD ROUTING (BOUNCER LOGIC)
            if (!isAdmin && !userHasAccess(tags, 'pro') && !userHasAccess(tags, 'newsfeed') && !userHasAccess(tags, 'squawk')) {
                if (userHasAccess(tags, 'courses') || userHasAccess(tags, 'course')) {
                    window.location.href = 'courses.html';
                    return;
                } else {
                    window.location.href = 'account.html';
                    return;
                }
            }
        }

        // --- AUDIO ENGINE ---
        let audioEnabled = false, seconds = 0, timerInterval;
        let audioCtx = null; 
        
        function initAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSynthesizedPing(volumeLevel) {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(volumeLevel * 0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        }

        function startTimer() { timerInterval = setInterval(() => { seconds++; const h = Math.floor(seconds/3600), m = Math.floor((seconds%3600)/60), s = seconds%60; document.getElementById('timerText').innerText = `(${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')})`; }, 1000); }
        function speakText(text) { if (!audioEnabled) return; const u = new SpeechSynthesisUtterance(text); u.volume = document.getElementById('volSlider').value; window.speechSynthesis.speak(u); }
        
        async function handleAudioToggle() {
            const btn = document.getElementById('audioToggle');
            const lbl = document.getElementById('audioLabel');
            btn.disabled = true;
            
            if (audioEnabled) { 
                lbl.innerText = "Disconnecting..."; 
                lbl.classList.remove('status-on'); 
                await new Promise(r => setTimeout(r, 800)); 
                clearInterval(timerInterval); 
                audioEnabled = false; 
                lbl.innerText = "Disconnected"; 
                document.getElementById('timerText').innerText = ""; 
            } else { 
                lbl.innerText = "Connecting..."; 
                initAudioContext();
                await new Promise(r => setTimeout(r, 800)); 
                audioEnabled = true; 
                seconds = 0; 
                startTimer(); 
                lbl.innerText = "On Air"; 
                lbl.classList.add('status-on'); 
            }
            btn.disabled = false;
        }

        // --- FILTER LOGIC ---
        let currentFilter = 'all';
        const filters = { 
            commodities: ['oil', 'gold', 'metal', 'copper', 'gas', 'brent', 'wti', 'silver'], 
            forex: ['usd', 'eur', 'jpy', 'gbp', 'fx', 'forex', 'currency', 'yield'], 
            equities: ['stock', 'equity', 'sp500', 'nasdaq', 'dow', 'nikkei', 'shares'], 
            crypto: ['bitcoin', 'btc', 'ethereum', 'eth', 'crypto', 'coin'], 
            centralBanks: ['fed', 'ecb', 'boj', 'bank of england', 'rba', 'central bank', 'interest rate', 'hike', 'cut'] 
        };
        const audioTriggerKeywords = ['hike', 'cut', 'pause', 'pivot', 'fed', 'ecb', 'boe', 'boj', 'tariff', 'sanctions', 'stimulus', 'buyout', 'merger', 'yield', 'opec', 'sec', 'etf', 'S&P Global Manufacturing', 'ISM Manufacturing', 'CPI', 'JOLTS', 'ADP', 'S&P Global Services', 'ISM Non-Manufacturing', 'Crude Oil Inventories', 'Initial Jobless Claims', 'New Home Sales', 'Average Hourly Earnings', 'Nonfarm Payrolls', 'Unemployment Rate', 'GDP', 'Core CPI', 'BoC Interest Rate Decision', 'BoJ Interest Rate Decision', 'Fed Interest Rate Decision', 'SNB Interest Rate Decision', 'BoE Interest Rate Decision', 'Retail Sales', 'Core Retail Sales', 'RBA Interest Rate Decision', 'Core PCE Price Index', 'Durable Goods Orders', 'Philadelphia Fed Manufacturing Index', '10-Year Note Auction', 'ECB Interest Rate Decision', 'PPI', 'German CPI', 'Manufacturing PMI', 'CB Consumer Confidence', 'Chicago PMI', 'HCOB Spain Manufacturing PMI', 'Yield Rises', 'Treasury Falls', 'Rate-Hike', 'Monetary Policy', 'Military Strikes', 'Missile Attack', 'Revokes', 'WTI Oil Jumps', 'Gold', 'Australia', 'AUD', 'US Military', 'Central Command', 'USA'];
        
        function setFilter(type) { 
            currentFilter = type; 
            
            document.querySelectorAll('.filter-btn').forEach(b => {
                if (b.dataset.type === type) b.classList.add('active');
                else b.classList.remove('active');
            });
            
            const mobileSelect = document.getElementById('mobileFilter');
            if (mobileSelect && mobileSelect.value !== type) {
                mobileSelect.value = type;
            }
            
            filterFeed(); 
        }

        function filterFeed() { 
            const query = document.getElementById('searchBar').value.toLowerCase(); 
            document.querySelectorAll('.news__item__outer').forEach(item => { 
                const text = item.innerText.toLowerCase(); 
                const matchesCategory = (currentFilter === 'all' || filters[currentFilter].some(word => text.includes(word))); 
                const matchesSearch = text.includes(query); 
                item.style.display = (matchesCategory && matchesSearch) ? '' : 'none'; 
            }); 
        }
        
        window.messenger_start_init = function() { 
            if (typeof Messenger !== 'undefined') {
                Messenger.init({ container: '#livesquawk_messenger_outer', product: 'forexanalytic' }); 
            }
        };
        
        document.getElementById('themeToggle').addEventListener('change', () => { document.body.classList.toggle('dark'); document.body.classList.toggle('light'); });
        
        const feedContainer = document.getElementById('livesquawk_messenger_outer');
        
        // --- MUTATION OBSERVER (ALERT LOGIC) ---
        new MutationObserver((mutations) => { 
            let shouldFilter = false;
            mutations.forEach(m => m.addedNodes.forEach(node => { 
                if (node.classList && node.classList.contains('news__item__outer')) { 
                    shouldFilter = true;
                    if (audioEnabled) {
                        const rawText = node.innerText;
                        const lowerText = rawText.toLowerCase();
                        
                        const hasKeyword = audioTriggerKeywords.some(kw => lowerText.includes(kw.toLowerCase()));
                        
                        if (hasKeyword) {
                            speakText(rawText); 
                        } else {
                            const vol = parseFloat(document.getElementById('volSlider').value);
                            playSynthesizedPing(vol);
                        }
                    }
                } 
            }));
            if (shouldFilter) filterFeed();
        }).observe(feedContainer, { childList: true, subtree: true });
        
        Object.defineProperty(window, 'self', { get: () => window.top });
        window.addEventListener('load', () => { const height = document.body.scrollHeight; window.parent.postMessage({ height }, '*'); });
        
        init();
    </script>
    <script src="https://www.livesquawk.com/partner_messenger/js/include_forexanalytic.js?v=3"></script>
</body>
</html>
