<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="icon" type="image/png" href="media/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f0f0f; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #1a1a1a; padding: 30px; border-radius: 8px; text-align: center; width: 100%; max-width: 300px; }
        input { padding: 12px; width: 100%; box-sizing: border-box; margin: 10px 0; border-radius: 4px; border: none; }
        button { padding: 12px; width: 100%; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .forgot-link { display: block; margin-top: 15px; color: #8b949e; text-decoration: none; font-size: 13px; transition: color 0.2s; }
        .forgot-link:hover { color: #fff; }
        #status { margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <img src="media/logo.png" alt="Company Logo" style="max-width: 150px; margin-bottom: 20px;">
    <h2>Terminal Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <a href="#" id="forgotBtn" class="forgot-link">Forgot Password?</a>
    <p id="status"></p>
</div>

<script>
    // 1. Correct API URL
    const SUPABASE_URL = 'https://fgidelsazisdqjfckerd.supabase.co';
    
    // 2. ANON Key
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnaWRlbHNhemlzZHFqZmNrZXJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5NDc1ODQsImV4cCI6MjA5ODUyMzU4NH0.BaxMA1FiXvyVDOsVNkN2tLNrkkCqsppVe54Sc8c0cYg';

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- DEVICE TRACKING FUNCTION ---
    async function logUserDeviceAndLocation(userId) {
        try {
            // 1. Parse basic device information from the browser's User-Agent
            const ua = navigator.userAgent;
            let deviceType = "Desktop";
            if (/Mobile|Android|iP(hone|od)|IEMobile|BlackBerry|Kindle|Silk-Accelerated|(hpw|web)OS|Opera M(obi|ini)/.test(ua)) {
                deviceType = "Mobile";
            } else if (/(tablet|ipad|playbook|silk)|(android(?!.*mobi))/i.test(ua)) {
                deviceType = "Tablet";
            }
            
            // Grab the OS to make it more detailed
            let os = "Unknown OS";
            if (ua.indexOf("Win") !== -1) os = "Windows";
            if (ua.indexOf("Mac") !== -1) os = "MacOS";
            if (ua.indexOf("Linux") !== -1) os = "Linux";
            if (ua.indexOf("Android") !== -1) os = "Android";
            if (ua.indexOf("like Mac") !== -1) os = "iOS";
            
            const finalDeviceString = `${deviceType} - ${os}`;

            // 2. Fetch the Country & IP using a free IP Geolocation API
            let country = "Unknown";
            let ipAddress = "Unknown";
            try {
                const geoResponse = await fetch('https://ipapi.co/json/');
                const geoData = await geoResponse.json();
                if (geoData.country_name) country = geoData.country_name;
                if (geoData.ip) ipAddress = geoData.ip;
            } catch (apiError) {
                console.log("Adblocker blocked IP tracking, skipping country/IP.");
            }

            // 3. Insert the new record into the login_history table
            await client.from('login_history').insert([{
                user_id: userId,
                ip_address: ipAddress,
                country: country,
                device_type: deviceType,
                os: os,
                raw_user_agent: ua
            }]);

            // 4. Silently update the database profiles table for quick view
            await client.from('profiles').update({
                last_device: finalDeviceString,
                last_country: country
            }).eq('id', userId);

        } catch (err) {
            console.error("Device tracking failed:", err);
        }
    }

    // --- FORGOT PASSWORD HANDLER ---
    document.getElementById('forgotBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const status = document.getElementById('status');

        if (!email) {
            status.style.color = '#ff4444';
            status.innerText = 'Please enter your email address to reset your password.';
            return;
        }

        status.style.color = '#b3b3b3';
        status.innerText = 'Sending reset link...';

        const { data, error } = await client.auth.resetPasswordForEmail(email, {
            redirectTo: 'https://analyst-wire.pages.dev/setup.html',
        });

        if (error) {
            status.style.color = '#ff4444';
            status.innerText = 'Error: ' + error.message;
        } else {
            status.style.color = '#28a745';
            status.innerText = 'Password reset link sent! Please check your email.';
        }
    });

    // --- LOGIN HANDLER ---
    document.getElementById('loginBtn').addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const status = document.getElementById('status');

        if (!email || !password) {
            status.style.color = '#ff4444';
            status.innerText = 'Please enter both email and password.';
            return;
        }

        status.style.color = '#b3b3b3';
        status.innerText = 'Logging in...';

        // Perform Login
        const { data, error } = await client.auth.signInWithPassword({ 
            email: email, 
            password: password 
        });

        if (error) {
            status.style.color = '#ff4444';
            status.innerText = 'Error: ' + error.message;
        } else {
            status.style.color = '#28a745';
            status.innerText = 'Success! Checking permissions...';
            
            // Check user role and subscription tag
            const { data: profile, error: profileError } = await client
                .from('profiles')
                .select('is_admin, subscription_tag')
                .eq('id', data.user.id)
                .single();

            // Run the device tracker in the background before redirecting
            await logUserDeviceAndLocation(data.user.id);

            const tag = profile?.subscription_tag ? profile.subscription_tag.toLowerCase() : '';
            const isAdmin = profile?.is_admin === true;

            // Strict Routing & Access Control
            if (isAdmin) {
                window.location.href = 'admin.html';
            } else if (tag.includes('pro')) {
                // Pro takes highest priority
                window.location.href = 'terminal.html';
            } else if (tag.includes('course') || tag.includes('courses')) {
                // If they have the course (and aren't Pro), send to courses
                window.location.href = 'courses.html';
            } else if (tag.includes('newsfeed')) {
                // If they only have newsfeed, send there
                window.location.href = '/newsfeed';
            } else {
                // If they don't have any of the above tags (e.g., free, empty, or cancelled)
                status.style.color = '#ff4444';
                status.innerText = 'Access Denied: Active subscription required.';
                await client.auth.signOut();
            }
        }
    });
</script>

</body>
</html>
