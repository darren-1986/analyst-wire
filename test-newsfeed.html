<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="media/favicon.png">
    <title>LiveSquawk Premium Feed</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="https://www.livesquawk.com/partner_messenger/css/partner_messenger.css">
    
    <style>
        /* Modern typography import */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        *, *:before, *:after { box-sizing: border-box; }
        
        body, .messenger__outer { transition: background 0.3s, color 0.3s; }
        body.dark, .dark .messenger__outer { background-color: #0A0A0a !important; color: #ffffff !important; }
        body.light, .light .messenger__outer { background-color: #f8fafc !important; color: #000000 !important; }
        body.dark .messenger__outer, .dark .messenger__outer * { color: #e2e8f0 !important; }

        /* Navigation */
        .top-nav { background: #0d1117; padding: 0 20px; height: 55px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1c2230; z-index: 1000; position: fixed; top: 0; left: 0; width: 100%; font-family: 'Inter', sans-serif; }
        .nav-links { display: flex; align-items: center; gap: 5px; }
        .nav-links a { color: #8b949e; text-decoration: none; margin-left: 15px; font-size: 13px; font-weight: 500; cursor: pointer; transition: color 0.2s; padding: 6px 12px; border-radius: 6px; }
        .nav-links a:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .nav-links a.active { color: #00b4f9; font-weight: 600; background: rgba(0, 180, 249, 0.1); }
        .mobile-menu-btn { display: none; font-size: 24px; color: #8b949e; cursor: pointer; background: none; border: none; }

        .dropdown { position: relative; margin-left: 10px; }
        .dropbtn { background: none; border: none; color: #8b949e; cursor: pointer; font-size: 18px; padding: 5px; transition: color 0.2s; }
        .dropbtn:hover { color: #fff; }
        .dropdown-content { display: none; position: absolute; right: 0; top: 35px; background-color: #161b22; min-width: 160px; border: 1px solid #30363d; z-index: 1000; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); overflow: hidden; }
        .dropdown-content a { color: #c9d1d9; padding: 10px 16px; text-decoration: none; display: block; font-size: 13px; font-family: 'Inter', sans-serif; }
        .dropdown-content a:hover { background-color: #21262d; color: #fff; }

        /* Base Layout */
        body { margin: 0; padding-top: 55px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; }
        .messenger__outer { flex-grow: 1; overflow: hidden; }
        .messenger__outer .newsfeed__title { display: none !important; }

        /* --- MODERNIZED TOP CONTROLS SECTION --- */
        .controls-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            background: #0A0A0a;
            border-bottom: 1px solid #1c2230;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        /* Large Audio Dashboard Module */
        .audio-dashboard {
            display: flex;
            align-items: center;
            background: #0d1117;
            border: 1px solid #1c2230;
            border-radius: 12px;
            padding: 15px 25px;
            flex-grow: 1;
            max-width: 900px;
            justify-content: space-between;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        /* Logo & Status Flex Container */
        .audio-left {
            display: flex;
            align-items: center;
            gap: 20px;
            min-width: 220px;
        }

        .squawk-logo {
            height: 40px;
            width: auto;
            object-fit: contain;
        }

        /* Power Toggle & Status */
        .audio-status-col {
            display: flex;
            flex-direction: column;
        }
        
        .audio-status-col button {
            background: none;
            border: none;
            color: #8b949e;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0;
            transition: color 0.3s;
        }
        
        .audio-status-col button:hover { color: #fff; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #475569; box-shadow: 0 0 5px #475569; transition: all 0.3s; }
        .status-on .status-dot { background: #00b4f9; box-shadow: 0 0 12px #00b4f9; }
        .status-on { color: #00b4f9 !important; }
        
        #timerText { font-size: 11px; color: #475569; margin-top: 4px; font-family: 'JetBrains Mono', monospace; min-height: 15px; }
        .status-on ~ #timerText { color: #00b4f9; }

        /* The Massive Audio Visualizer */
        .squawk-visualizer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            height: 60px;
            flex-grow: 1;
            padding: 0 30px;
            opacity: 0.15; 
            transition: opacity 0.4s ease;
        }
        
        .squawk-visualizer.active { opacity: 1; }
        
        .squawk-visualizer .bar {
            width: 4px;
            background: #00b4f9;
            border-radius: 2px;
            height: 4px; 
            box-shadow: 0 0 10px rgba(0, 180, 249, 0.6);
            transition: height 0.1s ease;
        }

        /* Resting waveform shape */
        .bar:nth-child(1), .bar:nth-child(17) { height: 4px; }
        .bar:nth-child(2), .bar:nth-child(16) { height: 8px; }
        .bar:nth-child(3), .bar:nth-child(15) { height: 12px; }
        .bar:nth-child(4), .bar:nth-child(14) { height: 6px; }
        .bar:nth-child(5), .bar:nth-child(13) { height: 16px; }
        .bar:nth-child(6), .bar:nth-child(12) { height: 24px; }
        .bar:nth-child(7), .bar:nth-child(11) { height: 14px; }
        .bar:nth-child(8), .bar:nth-child(10) { height: 35px; }
        .bar:nth-child(9) { height: 50px; background: #fff; box-shadow: 0 0 15px #fff, 0 0 30px #00b4f9; }

        /* Active animations mimicking speech */
        .squawk-visualizer.active .bar { animation: pulseWave 0.6s infinite alternate ease-in-out; }
        .squawk-visualizer.active .bar:nth-child(even) { animation-duration: 0.4s; animation-direction: alternate-reverse; }
        .squawk-visualizer.active .bar:nth-child(3n) { animation-duration: 0.7s; }
        .squawk-visualizer.active .bar:nth-child(9) { animation: centerPulse 0.4s infinite alternate ease-in-out; }

        @keyframes pulseWave {
            0% { height: 4px; }
            100% { height: 40px; box-shadow: 0 0 15px rgba(0, 180, 249, 1); }
        }
        @keyframes centerPulse {
            0% { height: 20px; }
            100% { height: 60px; box-shadow: 0 0 20px #fff, 0 0 40px #00b4f9; }
        }

        /* Integrated Volume Control */
        .vol-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.3);
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid #1c2230;
        }
        .vol-icon { font-size: 14px; opacity: 0.7; }
        .vol-slider { -webkit-appearance: none; width: 100px; height: 4px; background: #30363d; border-radius: 2px; outline: none; }
        .vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #fff; border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(255,255,255,0.5); }

        /* Modernized Filters & Tools */
        .tools-col {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        #searchBar { 
            padding: 8px 15px; 
            border-radius: 20px; 
            border: 1px solid #30363d; 
            background: #0d1117;
            color: #fff;
            transition: all 0.3s ease; 
            width: 200px; 
            font-family: 'Inter', sans-serif;
            font-size: 13px;
        }
        #searchBar:focus { border-color: #00b4f9; outline: none; box-shadow: 0 0 10px rgba(0, 180, 249, 0.2); }
        
        .filter-btn { 
            padding: 6px 16px; 
            cursor: pointer; 
            border-radius: 20px; 
            border: 1px solid #30363d; 
            background: #0d1117; 
            color: #8b949e; 
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .filter-btn:hover { background: #161b22; color: #fff; }
        .filter-btn.active { 
            background: rgba(0, 180, 249, 0.1); 
            border-color: #00b4f9; 
            color: #00b4f9; 
            box-shadow: 0 0 12px rgba(0, 180, 249, 0.2);
        }

        #mobileFilter { display: none; padding: 8px 15px; border-radius: 20px; border: 1px solid #30363d; background: #0d1117; color: white; outline: none; cursor: pointer; }

        /* Theme Switcher */
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; flex-shrink: 0; margin-left: 10px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #1c2230; transition: .4s; border-radius: 34px; border: 1px solid #30363d; }
        .slider:before { position: absolute; content: "🌙"; font-size: 10px; display: flex; align-items: center; justify-content: center; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: #0d1117; color: #fff; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: rgba(0, 180, 249, 0.2); border-color: #00b4f9; }
        input:checked + .slider:before { transform: translateX(22px); content: "☀️"; background-color: #00b4f9; }

        .custom-newsfeed-header { display: flex; align-items: center; padding: 10px 20px; font-family: 'Inter', system-ui, sans-serif; font-weight: 700; text-transform: uppercase; font-size: 14px; border-bottom: 1px solid #1c2230; color: #8b949e; }
        .green-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 12px; box-shadow: 0 0 8px #22c55e; }

        /* --- MOBILE RESPONSIVE STYLES --- */
        @media (max-width: 950px) {
            .mobile-menu-btn { display: block; }
            .nav-links { display: none; position: absolute; top: 55px; left: 0; width: 100%; background: #0d1117; flex-direction: column; align-items: flex-start; padding: 10px 20px; border-bottom: 1px solid #1c2230; z-index: 1001; }
            .nav-links.active-nav { display: flex; }
            .nav-links a { margin: 5px 0; width: 100%; text-align: left; padding-left: 0; }
            
            .audio-dashboard { flex-direction: column; gap: 20px; padding: 20px; }
            .audio-left { width: 100%; justify-content: space-between; }
            .audio-status-col { align-items: flex-end; text-align: right; }
            #timerText { margin-top: 2px; }
            
            .squawk-visualizer { width: 100%; height: 50px; }
            .vol-wrapper { width: 100%; justify-content: center; }
            .vol-slider { width: 100%; max-width: 250px; }
            
            .filter-btn { display: none; }
            #mobileFilter { display: block; flex-grow: 1; }
            #searchBar { width: 100%; }
        }
    </style>
</head>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // --- HELPER FUNCTION: Bulletproof parsing for Arrays, Strings, and JSON ---
        function userHasAccess(userTags, requiredTag) {
            if (!userTags) return false;
            let tagsArray = [];
            if (Array.isArray(userTags)) {
                tagsArray = userTags;
            } else if (typeof userTags === 'string') {
                try {
                    let parsed = JSON.parse(userTags);
                    tagsArray = Array.isArray(parsed) ? parsed : [userTags];
                } catch (e) {
                    tagsArray = userTags.split(',').map(s => s.trim());
                }
            }
            return tagsArray.some(tag => String(tag).toLowerCase() === requiredTag.toLowerCase());
        }

        // --- AUTH & PERMISSION CHECK ---
        const client = supabase.createClient('https://fgidelsazisdqjfckerd.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnaWRlbHNhemlzZHFqZmNrZXJkIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4Mjk0NzU4NCwiZXhwIjoyMDk4NTIzNTg0fQ.2UkKkgfJ6oERQrp2VOtiL9YP2MXKVWARAdoEkB5YJbY');

        async function init() {
            const { data: { session } } = await client.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            
            const { data: profileArray, error: profileError } = await client
                .from('profiles')
                .select('admin, active_tags')
                .eq('id', session.user.id)
                .limit(1);
                
            if (profileError) {
                alert("Database Error: " + profileError.message);
                await client.auth.signOut();
                window.location.href = 'index.html';
                return;
            }
            
            const profile = profileArray && profileArray.length > 0 ? profileArray[0] : null;
            const tags = profile?.active_tags ? profile.active_tags : [];
            const isAdmin = profile?.admin === true;

            if (!profile || tags.length === 0 || userHasAccess(tags, 'free')) {
                alert("Your subscription is inactive. Redirecting to login.");
                await client.auth.signOut();
                window.location.href = 'index.html';
                return;
            }

            if (!isAdmin && !userHasAccess(tags, 'pro') && !userHasAccess(tags, 'newsfeed') && !userHasAccess(tags, 'squawk')) {
                if (userHasAccess(tags, 'courses') || userHasAccess(tags, 'course')) {
                    window.location.href = 'courses.html'; return;
                } else {
                    window.location.href = 'account.html'; return;
                }
            }

            const navElements = {
                dashboard: document.getElementById('nav-dashboard'),
                newsfeed: document.getElementById('nav-newsfeed'),
                keyLevels: document.getElementById('nav-key-levels'),
                analysis: document.getElementById('nav-analysis'),
                profile: document.getElementById('nav-profile'),
                courses: document.getElementById('nav-courses'),
                admin: document.getElementById('nav-admin'),
                upload: document.getElementById('nav-upload')
            };

            Object.values(navElements).forEach(el => { if (el) el.style.display = 'none'; });

            if (isAdmin || userHasAccess(tags, 'pro')) {
                if (navElements.dashboard) navElements.dashboard.style.display = 'block';
                if (navElements.newsfeed) navElements.newsfeed.style.display = 'block';
                if (navElements.keyLevels) navElements.keyLevels.style.display = 'block';
                if (navElements.analysis) navElements.analysis.style.display = 'block';
                if (navElements.profile) navElements.profile.style.display = 'block';
                if (navElements.courses) navElements.courses.style.display = 'block';
                
                if (isAdmin) {
                    if (navElements.admin) navElements.admin.style.display = 'block';
                    if (navElements.upload) navElements.upload.style.display = 'block';
                }
            } else {
                if ((userHasAccess(tags, 'newsfeed') || userHasAccess(tags, 'squawk')) && navElements.newsfeed) navElements.newsfeed.style.display = 'block';
                if ((userHasAccess(tags, 'course') || userHasAccess(tags, 'courses')) && navElements.courses) navElements.courses.style.display = 'block';
                if (navElements.profile && (userHasAccess(tags, 'course') || userHasAccess(tags, 'courses') || userHasAccess(tags, 'newsfeed') || userHasAccess(tags, 'squawk'))) navElements.profile.style.display = 'block';
            }
        }

        function toggleNav() { document.getElementById("navLinks").classList.toggle("active-nav"); }
        function toggleDropdown(event) { event.stopPropagation(); document.getElementById("settingsDropdown").style.display = (document.getElementById("settingsDropdown").style.display === "block" ? "none" : "block"); }
        window.onclick = function(event) { if (!event.target.matches('.dropbtn')) { document.querySelectorAll('.dropdown-content').forEach(d => d.style.display = 'none'); } }
        document.getElementById('logoutBtn').addEventListener('click', async () => { await client.auth.signOut(); window.location.href = 'index.html'; });

        // --- AUDIO ENGINE ---
        let audioEnabled = false, seconds = 0, timerInterval;
        let audioCtx = null; 
        
        function initAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        }

        function playSynthesizedPing(volumeLevel) {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(volumeLevel * 0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);

            const viz = document.getElementById('squawkVisualizer');
            viz.classList.add('active');
            setTimeout(() => viz.classList.remove('active'), 500);
        }

        function startTimer() { timerInterval = setInterval(() => { seconds++; const h = Math.floor(seconds/3600), m = Math.floor((seconds%3600)/60), s = seconds%60; document.getElementById('timerText').innerText = `(${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')})`; }, 1000); }
        
        function speakText(text) { 
            if (!audioEnabled) return; 
            const u = new SpeechSynthesisUtterance(text); 
            u.volume = document.getElementById('volSlider').value; 
            
            const viz = document.getElementById('squawkVisualizer');
            u.onstart = () => viz.classList.add('active');
            u.onend = () => viz.classList.remove('active');
            u.onerror = () => viz.classList.remove('active'); 
            
            window.speechSynthesis.speak(u); 
        }
        
        async function handleAudioToggle() {
            const btn = document.getElementById('audioToggle');
            const lbl = document.getElementById('audioLabel');
            const btnEl = lbl.parentElement;
            btn.disabled = true;
            
            if (audioEnabled) { 
                lbl.innerText = "Disconnecting..."; 
                btnEl.classList.remove('status-on'); 
                await new Promise(r => setTimeout(r, 800)); 
                clearInterval(timerInterval); 
                audioEnabled = false; 
                lbl.innerText = "Disconnected"; 
                document.getElementById('timerText').innerText = ""; 
            } else { 
                lbl.innerText = "Connecting..."; 
                initAudioContext();
                await new Promise(r => setTimeout(r, 800)); 
                audioEnabled = true; 
                seconds = 0; 
                startTimer(); 
                lbl.innerText = "On Air"; 
                btnEl.classList.add('status-on'); 
            }
            btn.disabled = false;
        }

        // --- FILTER LOGIC (Functions untouched as requested) ---
        let currentFilter = 'all';
        const filters = { 
            commodities: ['oil', 'gold', 'metal', 'copper', 'gas', 'brent', 'wti', 'silver'], 
            forex: ['usd', 'eur', 'jpy', 'gbp', 'fx', 'forex', 'currency', 'yield'], 
            equities: ['stock', 'equity', 'sp500', 'nasdaq', 'dow', 'nikkei', 'shares'], 
            crypto: ['bitcoin', 'btc', 'ethereum', 'eth', 'crypto', 'coin'], 
            centralBanks: ['fed', 'ecb', 'boj', 'bank of england', 'rba', 'central bank', 'interest rate', 'hike', 'cut'] 
        };
        const audioTriggerKeywords = ['hike', 'cut', 'pause', 'pivot', 'fed', 'ecb', 'boe', 'boj', 'tariff', 'sanctions', 'stimulus', 'buyout', 'merger', 'yield', 'opec', 'sec', 'etf', 'S&P Global Manufacturing', 'ISM Manufacturing', 'CPI', 'JOLTS', 'ADP', 'S&P Global Services', 'ISM Non-Manufacturing', 'Crude Oil Inventories', 'Initial Jobless Claims', 'New Home Sales', 'Average Hourly Earnings', 'Nonfarm Payrolls', 'Unemployment Rate', 'GDP', 'Core CPI', 'BoC Interest Rate Decision', 'BoJ Interest Rate Decision', 'Fed Interest Rate Decision', 'SNB Interest Rate Decision', 'BoE Interest Rate Decision', 'Retail Sales', 'Core Retail Sales', 'RBA Interest Rate Decision', 'Core PCE Price Index', 'Durable Goods Orders', 'Philadelphia Fed Manufacturing Index', '10-Year Note Auction', 'ECB Interest Rate Decision', 'PPI', 'German CPI', 'Manufacturing PMI', 'CB Consumer Confidence', 'Chicago PMI', 'HCOB Spain Manufacturing PMI', 'Yield Rises', 'Treasury Falls', 'Rate-Hike', 'Monetary Policy', 'Military Strikes', 'Missile Attack', 'Revokes', 'WTI Oil Jumps', 'Gold', 'Australia', 'AUD', 'US Military', 'Central Command', 'USA'];
        
        function setFilter(type) { 
            currentFilter = type; 
            document.querySelectorAll('.filter-btn').forEach(b => {
                if (b.dataset.type === type) b.classList.add('active');
                else b.classList.remove('active');
            });
            const mobileSelect = document.getElementById('mobileFilter');
            if (mobileSelect && mobileSelect.value !== type) { mobileSelect.value = type; }
            filterFeed(); 
        }

        function filterFeed() { 
            const query = document.getElementById('searchBar').value.toLowerCase(); 
            document.querySelectorAll('.news__item__outer').forEach(item => { 
                const text = item.innerText.toLowerCase(); 
                const matchesCategory = (currentFilter === 'all' || filters[currentFilter].some(word => text.includes(word))); 
                const matchesSearch = text.includes(query); 
                item.style.display = (matchesCategory && matchesSearch) ? '' : 'none'; 
            }); 
        }
        
        window.messenger_start_init = function() { if (typeof Messenger !== 'undefined') Messenger.init({ container: '#livesquawk_messenger_outer', product: 'forexanalytic' }); };
        document.getElementById('themeToggle').addEventListener('change', () => { document.body.classList.toggle('dark'); document.body.classList.toggle('light'); });
        
        const feedContainer = document.getElementById('livesquawk_messenger_outer');
        
        new MutationObserver((mutations) => { 
            mutations.forEach(m => m.addedNodes.forEach(node => { 
                if (node.classList && node.classList.contains('news__item__outer')) { 
                    if (audioEnabled) {
                        const rawText = node.innerText;
                        const lowerText = rawText.toLowerCase();
                        const hasKeyword = audioTriggerKeywords.some(kw => lowerText.includes(kw.toLowerCase()));
                        if (hasKeyword) {
                            speakText(rawText); 
                        } else {
                            const vol = parseFloat(document.getElementById('volSlider').value);
                            playSynthesizedPing(vol);
                        }
                    }
                } 
            })); 
        }).observe(feedContainer, { childList: true, subtree: true });
        
        Object.defineProperty(window, 'self', { get: () => window.top });
        window.addEventListener('load', () => { const height = document.body.scrollHeight; window.parent.postMessage({ height }, '*'); });
        
        init();
    </script>
    <script src="https://www.livesquawk.com/partner_messenger/js/include_forexanalytic.js?v=3"></script>
</body>
