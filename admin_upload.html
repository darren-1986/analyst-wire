<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="media/favicon.png">
    <title>Analyst Wire | Admin Upload</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body { background: #090b10; color: #c9d1d9; font-family: 'Inter', sans-serif; margin: 0; font-size: 14px; }

        /* Top Navigation (Synced with admin.html) */
        .top-nav { background: #0d1117; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; flex-wrap: wrap; position: relative; }
        .nav-brand { color: #fff; font-weight: 700; font-size: 1.1rem; display: none; }
        .nav-links { display: flex; gap: 15px; align-items: center; width: 100%; flex-wrap: wrap; }
        .nav-links button, .nav-links a { background: none; border: none; color: #8b949e; cursor: pointer; font-size: 0.95rem; text-decoration: none; font-weight: 600; padding: 6px 12px; border-radius: 6px; transition: all 0.2s; text-align: left; }
        .nav-links button:hover, .nav-links a:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .nav-links .active { color: #2962ff; background: rgba(41, 98, 255, 0.1); }
        .menu-toggle { display: none; background: transparent; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; padding: 0; line-height: 1; }

        /* Main Container */
        .upload-container { max-width: 800px; width: 95%; margin: 40px auto; background: #161b22; padding: 30px; border-radius: 12px; border: 1px solid #30363d; box-shadow: 0 8px 24px rgba(0,0,0,0.2); box-sizing: border-box; }
        
        /* Tabs */
        .tabs-header { display: flex; border-bottom: 1px solid #30363d; margin-bottom: 25px; overflow-x: auto; gap: 10px; -webkit-overflow-scrolling: touch; }
        .tabs-header::-webkit-scrollbar { display: none; }
        .tab-button { background: none; border: none; color: #8b949e; padding: 12px 15px; cursor: pointer; font-size: 0.95rem; font-weight: 600; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; font-family: 'Inter', sans-serif; }
        .tab-button:hover { color: #fff; }
        .tab-button.active { color: #2962ff; border-bottom: 2px solid #2962ff; color: #fff; }
        
        .tab-pane { display: none; }
        .tab-pane.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Typography & Inputs */
        h2 { margin-top: 0; color: #fff; font-size: 1.5rem; font-weight: 600; margin-bottom: 20px; }
        label { font-size: 0.85rem; color: #8b949e; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; display: block; margin-bottom: 8px; }
        
        input[type="file"], input[type="date"], textarea { margin-bottom: 20px; display: block; width: 100%; padding: 12px; background: #0d1117; color: white; border: 1px solid #30363d; border-radius: 6px; box-sizing: border-box; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s; }
        input[type="file"]:focus, input[type="date"]:focus, textarea:focus { border-color: #2962ff; }
        input[type="file"]::file-selector-button { background: #30363d; border: none; color: #fff; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-right: 15px; font-weight: 600; font-family: 'Inter', sans-serif; transition: background 0.2s; }
        input[type="file"]::file-selector-button:hover { background: #4b5563; }
        
        textarea { resize: vertical; line-height: 1.5; min-height: 150px; }
        
        /* Buttons */
        button.action-btn { background: #2962ff; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: 600; width: 100%; font-family: 'Inter', sans-serif; transition: background 0.2s; }
        button.action-btn:hover { background: #1c4ed8; }
        
        /* Status & Debug */
        .status-msg { margin-top: 20px; font-size: 0.95rem; font-weight: 500; text-align: center; color: #8b949e; padding: 10px; border-radius: 6px; }
        #debug-panel { background: #0d1117; padding: 15px; margin-top: 20px; border-radius: 6px; border: 1px solid #30363d; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; display: none; color: #3fb950; overflow-x: auto; }

        /* Mobile Adaptive Styling */
        @media (max-width: 768px) {
            .nav-brand { display: block; }
            .menu-toggle { display: block; }
            .nav-links { display: none; flex-direction: column; align-items: stretch; margin-top: 15px; width: 100%; }
            .nav-links.show { display: flex; }
            #logoutBtn { margin-left: 0 !important; color: #f85149; }
            
            .upload-container { padding: 20px; margin: 15px auto; width: 100%; border-radius: 0; border-left: none; border-right: none; }
            .tab-button { font-size: 0.9rem; padding: 10px 12px; }
        }
    </style>
</head>
<body>

<div class="top-nav">
    <div class="nav-brand">Analyst Wire Admin</div>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <div class="nav-links" id="navLinks">
        <a href="admin.html">Users</a>
        <a href="admin.html">Revenue</a>
        <a href="terminal.html">Terminal</a>
        <a href="admin_upload.html" class="active">Upload Data</a>
        <button id="logoutBtn" style="color: #f85149; margin-left: auto;">Logout</button>
    </div>
</div>

<div class="upload-container">
    <div class="tabs-header">
        <button class="tab-button active" onclick="switchTab(event, 'tab-key-levels')">Key Levels</button>
        <button class="tab-button" onclick="switchTab(event, 'tab-expiries')">FX Option Expiries</button>
        <button class="tab-button" onclick="switchTab(event, 'tab-project-3')">Trade Ideas</button>
    </div>

    <div id="tab-key-levels" class="tab-pane active">
        <h2>Upload Key Levels</h2>
        <label>Select Date</label>
        <input type="date" id="upload-date-kl">
        
        <label>Upload CSV or Excel File</label>
        <input type="file" id="excelFile-kl" accept=".csv, text/csv, application/vnd.ms-excel, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, */*" />
        
        <button class="action-btn" onclick="processKeyLevels()">Upload Key Levels</button>
        <div id="status-kl" class="status-msg"></div>
        <div id="debug-panel"></div>
    </div>

    <div id="tab-expiries" class="tab-pane">
        <h2>Upload FX Option Expiries</h2>
        <label>Select Trade Date</label>
        <input type="date" id="upload-date-exp">
        
        <label>Upload CSV or Excel File</label>
        <input type="file" id="excelFile-exp" accept=".csv, text/csv, application/vnd.ms-excel, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, */*" />
        
        <button class="action-btn" onclick="processExpiries()">Extract & Upload Expiries</button>
        <div id="status-exp" class="status-msg"></div>
    </div>

    <div id="tab-project-3" class="tab-pane">
        <h2>Upload Trade Ideas</h2>
        <p style="color: #8b949e; margin-bottom: 15px; font-size: 0.9rem; line-height: 1.5;">Paste raw text containing one or multiple trade ideas below.</p>
        <textarea id="trade-ideas-text" placeholder="July 21st 2026:&#10;Trade Idea 1: EUR/GBP Call Option&#10;Instrument: EUR/GBP&#10;Direction: Long&#10;Strike: 0.8510 call&#10;..."></textarea>
        
        <button class="action-btn" onclick="processTradeIdeas()">Upload Trade Ideas</button>
        <div id="status-ti" class="status-msg"></div>
    </div>
</div>

<script>
    function toggleMenu() {
        document.getElementById('navLinks').classList.toggle('show');
    }

    function switchTab(evt, tabId) {
        document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
        document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        evt.currentTarget.classList.add('active');
    }

    const client = supabase.createClient('https://fgidelsazisdqjfckerd.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnaWRlbHNhemlzZHFqZmNrZXJkIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4Mjk0NzU4NCwiZXhwIjoyMDk4NTIzNTg0fQ.2UkKkgfJ6oERQrp2VOtiL9YP2MXKVWARAdoEkB5YJbY');

    // Admin authorization check (Strict parity with admin.html)
    async function init() {
        const { data: { session } } = await client.auth.getSession();
        if (!session) { window.location.href = 'index.html'; return; }
        
        const { data: profileArray, error } = await client
            .from('profiles')
            .select('admin')
            .eq('id', session.user.id)
            .limit(1);
            
        const profile = profileArray?.[0];
        
        if (!profile || profile.admin !== true) { 
            window.location.href = 'terminal.html'; 
            return; 
        }
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => { 
        await client.auth.signOut(); 
        window.location.href = 'index.html'; 
    });

    function parseFileToRows(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet, {header: 1, defval: null});
                    resolve(rows);
                } catch(err) { reject(err); }
            };
            reader.readAsArrayBuffer(file);
        });
    }

    async function processKeyLevels() {
        const fileInput = document.getElementById('excelFile-kl');
        const date = document.getElementById('upload-date-kl').value;
        const statusDiv = document.getElementById('status-kl');
        const debugDiv = document.getElementById('debug-panel');

        debugDiv.style.display = 'none';

        if (!fileInput.files.length || !date) return alert("Select a file AND choose a target date.");
        statusDiv.innerText = "Processing Key Levels Data...";

        try {
            const rows = await parseFileToRows(fileInput.files[0]);
            if (rows.length < 2) return statusDiv.innerText = "Error: File is empty or invalid.";

            const rawHeaders = rows[0];
            const formattedData = [];
            const uploadTimestamp = new Date().toISOString();

            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || !row[0]) continue;

                let payloadObj = { trade_date: date, last_updated: uploadTimestamp };

                rawHeaders.forEach((header, idx) => {
                    if (header === undefined || header === null) return;
                    let h = String(header).toLowerCase().replace(/[^a-z0-9]/g, '');
                    let dbKey = "";

                    if (h.includes('ticker') || h.includes('symbol')) dbKey = 'ticker';
                    else if (h.includes('prev') || h.includes('prior') || h.includes('previous')) dbKey = 'prev_bull_bear';
                    else if (h.includes('bull') || h.includes('bear')) dbKey = 'bull_bear_line';
                    else if (h.includes('bias')) dbKey = 'bias';
                    else if (h === 's1') dbKey = 's1';
                    else if (h === 'r1') dbKey = 'r1';
                    else if (h === 's2') dbKey = 's2';
                    else if (h === 'r2') dbKey = 'r2';
                    else if (h.includes('analysis')) dbKey = 'analysis';
                    else if (h.includes('lollipop') || h.includes('lollopop')) dbKey = 'lollipop';

                    if (dbKey && row[idx] !== undefined && row[idx] !== null) {
                        let val = String(row[idx]).trim();
                        if (val === '' || val === '-' || val.toLowerCase() === 'n/a') {
                            payloadObj[dbKey] = null;
                        } else {
                            const numericColumns = ['prev_bull_bear', 'bull_bear_line', 's1', 'r1', 's2', 'r2'];
                            if (numericColumns.includes(dbKey)) {
                                val = val.replace(/,/g, '.').replace(/[^\d.-]/g, '');
                                let parsedVal = parseFloat(val);
                                payloadObj[dbKey] = isNaN(parsedVal) ? null : parsedVal;
                            } else {
                                payloadObj[dbKey] = val;
                            }
                        }
                    }
                });

                if (payloadObj.ticker) {
                    formattedData.push(payloadObj);
                }
            }

            if (formattedData.length === 0) return statusDiv.innerText = "Error: No valid rows extracted.";
            statusDiv.innerText = `Pushing ${formattedData.length} rows to database...`;
            await client.from('key_levels').delete().eq('trade_date', date);
            const { error } = await client.from('key_levels').insert(formattedData);
            
            if (error) {
                statusDiv.innerText = "Supabase Error: " + error.message;
                statusDiv.style.color = "#f85149";
            } else {
                statusDiv.innerText = `Success! Uploaded ${formattedData.length} Key Levels.`;
                statusDiv.style.color = "#3fb950";
            }

        } catch (err) {
            statusDiv.innerText = "Parsing Error: " + err.message;
            statusDiv.style.color = "#f85149";
        }
    }

    async function processExpiries() {
        const fileInput = document.getElementById('excelFile-exp');
        const date = document.getElementById('upload-date-exp').value;
        const statusDiv = document.getElementById('status-exp');

        if (!fileInput.files.length || !date) return alert("Select a data file AND date entry.");
        statusDiv.innerText = "Parsing FX Option Expiries...";

        try {
            const rows = await parseFileToRows(fileInput.files[0]);
            if (rows.length < 3) return statusDiv.innerText = "Error: Dataset lacks required structural row depth.";

            const headers = rows[0]; 
            const spotRow = rows[1]; 
            const tickerMap = {};
            const spotPriceMap = {};
            const corePortfolio = ['EUR/USD', 'GBP/USD', 'USD/JPY', 'AUD/USD', 'USD/CAD', 'EUR/GBP'];

            headers.forEach((header, index) => {
                const tickerStr = String(header || '').trim();
                if (corePortfolio.includes(tickerStr)) {
                    tickerMap[index] = tickerStr;
                    const rawSpot = spotRow ? spotRow[index] : null;
                    if (rawSpot !== undefined && rawSpot !== null && String(rawSpot).trim() !== '') {
                        spotPriceMap[tickerStr] = parseFloat(String(rawSpot).replace(/,/g, '.').replace(/[^\d.-]/g, ''));
                    }
                }
            });

            const flatData = [];
            const regex = /([\d\.,]+)\s*\([^\d]*([\d\.,]+)([bm]+)\)/gi;
            const uploadTimestamp = new Date().toISOString();

            for (let i = 2; i < rows.length; i++) {
                const row = rows[i];
                if (!row) continue;

                Object.keys(tickerMap).forEach(colIdx => {
                    const ticker = tickerMap[colIdx];
                    const cellString = row[colIdx];
                    if (!cellString) return;

                    let match;
                    regex.lastIndex = 0;

                    while ((match = regex.exec(String(cellString))) !== null) {
                        const strike = parseFloat(match[1].replace(/,/g, '.'));
                        let vol = parseFloat(match[2].replace(/,/g, '.'));
                        const denomination = match[3].toLowerCase();

                        if (denomination.includes('m')) vol = vol / 1000;

                        flatData.push({
                            trade_date: date,
                            ticker: ticker,
                            strike: strike,
                            volume: parseFloat(vol.toFixed(3)),
                            spot_price: spotPriceMap[ticker] || null,
                            last_updated: uploadTimestamp
                        });
                    }
                });
            }

            if (flatData.length === 0) return statusDiv.innerText = "Error: Zero options columns successfully targeted.";
            statusDiv.innerText = `Pushing ${flatData.length} FX Option entries to Supabase...`;
            await client.from('order_levels').delete().eq('trade_date', date);
            const { error } = await client.from('order_levels').insert(flatData);
            
            if (error) {
                statusDiv.innerText = "Supabase Error: " + error.message;
                statusDiv.style.color = "#f85149";
            } else {
                statusDiv.innerText = `Success! Uploaded ${flatData.length} FX Option Expiries seamlessly.`;
                statusDiv.style.color = "#3fb950";
            }

        } catch (err) {
            statusDiv.innerText = "Execution Failure: " + err.message;
            statusDiv.style.color = "#f85149";
        }
    }

    async function processTradeIdeas() {
        const textInput = document.getElementById('trade-ideas-text').value.trim();
        const statusDiv = document.getElementById('status-ti');

        if (!textInput) return alert("Please paste trade ideas text.");
        statusDiv.innerText = "Parsing Trade Ideas...";

        try {
            let globalDate = new Date().toISOString().split('T')[0];
            const dateLineMatch = textInput.match(/^([A-Za-z]+ \d{1,2}(?:st|nd|rd|th)? \d{4})/i);
            if (dateLineMatch) {
                globalDate = dateLineMatch[1];
            }

            const tradeBlocks = textInput.split(/Trade Idea \d+:/i);
            const parsedData = [];
            const uploadTimestamp = new Date().toISOString();

            tradeBlocks.forEach((block, index) => {
                if (!block.trim()) return;
                if (index === 0 && !block.toLowerCase().includes('instrument:')) return;

                let normalizedBlock = block
                    .replace(/(Instrument:)/gi, '\n$1')
                    .replace(/(Direction:)/gi, '\n$1')
                    .replace(/(Strike:)/gi, '\n$1')
                    .replace(/(Entry:)/gi, '\n$1')
                    .replace(/(Key Levels:)/gi, '\n$1')
                    .replace(/(Rationale:)/gi, '\n$1')
                    .replace(/(Conditions:)/gi, '\n$1');

                const lines = normalizedBlock.split('\n');
                let currentKey = 'title';
                let trade = {
                    trade_date: globalDate,
                    title: '',
                    instrument: '',
                    direction: '',
                    strike: null,
                    entry: null,
                    key_levels: null, 
                    rationale: '',
                    conditions: '',
                    last_updated: uploadTimestamp
                };

                lines.forEach(line => {
                    line = line.trim();
                    if (!line) return;

                    let lowerLine = line.toLowerCase();
                    if (lowerLine.startsWith('instrument:')) { currentKey = 'instrument'; trade.instrument = line.substring(11).trim(); }
                    else if (lowerLine.startsWith('direction:')) { currentKey = 'direction'; trade.direction = line.substring(10).trim(); }
                    else if (lowerLine.startsWith('strike:')) { currentKey = 'strike'; trade.strike = line.substring(7).trim(); }
                    else if (lowerLine.startsWith('entry:')) { currentKey = 'entry'; trade.entry = line.substring(6).trim(); }
                    else if (lowerLine.startsWith('key levels:')) { currentKey = 'key_levels'; trade.key_levels = line.substring(11).trim(); }
                    else if (lowerLine.startsWith('rationale:')) { currentKey = 'rationale'; trade.rationale = line.substring(10).trim(); }
                    else if (lowerLine.startsWith('conditions:')) { currentKey = 'conditions'; trade.conditions = line.substring(11).trim(); }
                    else {
                        if (currentKey && trade[currentKey] !== undefined) {
                            if (currentKey === 'title') {
                                trade.title += (trade.title ? ' ' : '') + line;
                            } else {
                                trade[currentKey] += ' ' + line;
                            }
                        }
                    }
                });

                if (trade.instrument) {
                    parsedData.push(trade);
                }
            });

            if (parsedData.length === 0) {
                return statusDiv.innerText = "Error: No valid trade ideas could be parsed from the text provided.";
            }

            statusDiv.innerText = `Pushing ${parsedData.length} Trade Ideas to Supabase...`;
            
            const { error } = await client.from('trade_ideas').insert(parsedData);

            if (error) {
                statusDiv.innerText = "Supabase Error: " + error.message;
                statusDiv.style.color = "#f85149";
                return;
            } 
            
            const { data: datesData } = await client.from('trade_ideas').select('trade_date');
            
            if (datesData) {
                const uniqueDates = [...new Set(datesData.map(d => d.trade_date))]
                    .sort((a, b) => new Date(b.replace(/(st|nd|rd|th)/, '')) - new Date(a.replace(/(st|nd|rd|th)/, '')));
                
                if (uniqueDates.length > 2) {
                    const datesToDelete = uniqueDates.slice(2);
                    for (const oldDate of datesToDelete) {
                        await client.from('trade_ideas').delete().eq('trade_date', oldDate);
                    }
                }
            }

            statusDiv.innerText = `Success! Uploaded ${parsedData.length} Trade Idea(s) and cleaned up older data.`;
            statusDiv.style.color = "#3fb950";
            document.getElementById('trade-ideas-text').value = ''; 

        } catch (err) {
            statusDiv.innerText = "Execution Failure: " + err.message;
            statusDiv.style.color = "#f85149";
        }
    }
    
    // Initialize admin verification on load
    init();
</script>
</body>
</html>
