<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyst Wire - Market Squawk</title>
  <style>
    body {
      background: #0a0e17;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 15px;
      margin: 0;
    }
    .widget-container {
      max-width: 800px;
      margin: 0 auto;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
    }
    .widget-header {
      background: #030712;
      padding: 15px 20px;
      border-bottom: 1px solid #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .widget-title {
      font-weight: 800;
      font-size: 1.1em;
      color: #10b981;
      letter-spacing: 0.5px;
    }
    .controls-panel {
      padding: 15px 20px;
      background: #0f172a;
      border-bottom: 1px solid #1f2937;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 0.85em;
    }
    .control-row {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .category-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding-top: 10px;
      border-top: 1px solid #1e293b;
    }
    .feed-container {
      max-height: 550px;
      overflow-y: auto;
    }
    .news-item {
      padding: 12px 20px;
      border-bottom: 1px solid #1e293b;
    }
    .news-item.important {
      border-left: 4px solid #ef4444;
      background: rgba(239, 68, 68, 0.05);
    }
    .news-time {
      color: #64748b;
      font-size: 0.8em;
      margin-bottom: 4px;
      font-weight: bold;
    }
    .news-title {
      font-size: 0.98em;
      line-height: 1.4;
      color: #f8fafc;
    }
    .badge-important {
      background: #ef4444;
      color: #fff;
      font-size: 0.7em;
      padding: 2px 6px;
      border-radius: 3px;
      margin-right: 6px;
      font-weight: bold;
    }
    label { cursor: pointer; display: flex; align-items: center; gap: 5px; }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="widget-header">
      <span class="widget-title">ANALYST WIRE // SQUAWK</span>
      <label style="color: #fbbf24; font-weight: bold;">
        <input type="checkbox" id="squawk-toggle"> 🔊 AUDIO SQUAWK
      </label>
    </div>

    <div class="controls-panel">
      <div class="control-row">
        <label style="color: #ef4444; font-weight: bold;">
          <input type="checkbox" id="importance-toggle"> ⚠️ IMPORTANT ONLY
        </label>
      </div>

      <div class="category-filters">
        <span style="color: #64748b; font-weight: bold;">Categories:</span>
        <label><input type="checkbox" class="cat-filter" value="centralBanks" checked> Central Banks</label>
        <label><input type="checkbox" class="cat-filter" value="equities" checked> Equities</label>
        <label><input type="checkbox" class="cat-filter" value="forex" checked> Forex</label>
        <label><input type="checkbox" class="cat-filter" value="commodities" checked> Commodities</label>
        <label><input type="checkbox" class="cat-filter" value="crypto" checked> Crypto</label>
      </div>
    </div>
    
    <div id="market-feed" class="feed-container">
      <div id="loading-msg" style="padding: 20px; color: #64748b; text-align: center;">
        Awaiting API Key...
      </div>
    </div>
  </div>

  <script>
    const processedHeadlines = new Set();
    
    // ==========================================
    // INSERT YOUR FREE FINNHUB API KEY HERE
    // ==========================================
    const API_KEY = 'd9fjrs9r01qu5nhepvo0d9fjrs9r01qu5nhepvog'; 

    /* Categorization Arrays */
    const categoryKeywords = {
      centralBanks: ['fed', 'fomc', 'ecb', 'boe', 'boj', 'rba', 'rate', 'powell', 'lagarde', 'cpi', 'inflation'],
      equities: ['stock', 'shares', 'nasdaq', 'spx', 's&p', 'dow', 'earnings', 'nyse'],
      forex: ['usd', 'eur', 'gbp', 'jpy', 'aud', 'forex', 'currency', 'dollar'],
      commodities: ['gold', 'silver', 'oil', 'wti', 'brent', 'crude', 'opec'],
      crypto: ['bitcoin', 'btc', 'ethereum', 'eth', 'crypto', 'sec']
    };

    const importanceKeywords = ['breaking', 'urgent', 'alert', 'unexpected', 'surge', 'plunge'];

    function checkImportance(title) {
      const lower = title.toLowerCase();
      const isAllUpper = title === title.toUpperCase() && title.length > 20;
      return isAllUpper || importanceKeywords.some(kw => lower.includes(kw));
    }

    function getMatchedCategories(title) {
      const lower = title.toLowerCase();
      const matched = [];
      for (const [category, keywords] of Object.entries(categoryKeywords)) {
        if (keywords.some(kw => lower.includes(kw))) {
          matched.push(category);
        }
      }
      return matched;
    }

    async function fetchMarketNews() {
      if (API_KEY === 'YOUR_FINNHUB_KEY') {
        document.getElementById('loading-msg').innerHTML = 'Please add your API key to the script.';
        return;
      }

      const container = document.getElementById('market-feed');
      const apiUrl = `https://finnhub.io/api/v1/news?category=general&token=${API_KEY}`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error("API Connection Failed.");
        
        const data = await response.json();
        const items = data.slice(0, 30).reverse(); // Process newest last so they stack on top
        
        const loadingMsg = document.getElementById('loading-msg');
        if (loadingMsg) loadingMsg.remove();

        const audioEnabled = document.getElementById('squawk-toggle').checked;
        const importantOnly = document.getElementById('importance-toggle').checked;
        const activeCategories = Array.from(document.querySelectorAll('.cat-filter:checked')).map(cb => cb.value);

        items.forEach(item => {
          const title = item.headline;
          const pubDate = new Date(item.datetime * 1000); // Finnhub uses Unix timestamps
          
          if (title && !processedHeadlines.has(title)) {
            processedHeadlines.add(title);

            const isImportant = checkImportance(title);
            const matchedCats = getMatchedCategories(title);
            const passesCategory = matchedCats.length === 0 || matchedCats.some(cat => activeCategories.includes(cat));

            // Apply UI Filters
            if (importantOnly && !isImportant) return;
            if (!passesCategory) return;

            // Render Headline
            const headlineEl = document.createElement('div');
            headlineEl.className = `news-item ${isImportant ? 'important' : ''}`;
            headlineEl.innerHTML = `
              <div class="news-time">${pubDate.toLocaleTimeString()}</div>
              <div class="news-title">
                ${isImportant ? '<span class="badge-important">IMPORTANT</span>' : ''}
                ${title}
              </div>
            `;
            container.prepend(headlineEl);

            // Trigger Audio Squawk
            if (audioEnabled) {
              window.speechSynthesis.cancel();
              const utterance = new SpeechSynthesisUtterance(title);
              utterance.rate = 1.15;
              window.speechSynthesis.speak(utterance);
            }
          }
        });
        
      } catch (error) {
        document.getElementById('loading-msg').innerHTML = `<span style="color: #ef4444;">Error: ${error.message}</span>`;
      }
    }

    fetchMarketNews();
    setInterval(fetchMarketNews, 20000);
  </script>

</body>
</html>
