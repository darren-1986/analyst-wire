<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyst Wire - Market Feed & Squawk</title>
  <style>
    body {
      background: #f4f4f9;
      padding: 20px;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    .widget-container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
    }
    .widget-header {
      background: #111;
      color: #fff;
      padding: 15px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .feed-container {
      max-height: 500px;
      overflow-y: auto;
    }
    .loading-msg {
      padding: 20px;
      color: #666;
      text-align: center;
    }
    .news-item {
      padding: 15px;
      border-bottom: 1px solid #eee;
    }
    .news-time {
      color: #888;
      font-size: 0.8em;
      margin-bottom: 5px;
    }
    .news-title {
      font-weight: bold;
      font-size: 1.05em;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="widget-header">
      <span>Analyst Wire Market Feed</span>
      <label style="cursor: pointer; font-size: 0.9em; font-weight: normal;">
        <input type="checkbox" id="squawk-toggle"> Enable Audio Squawk
      </label>
    </div>
    
    <div id="market-feed" class="feed-container">
      <div id="loading-msg" class="loading-msg">
        Connecting securely to Finnhub API...
      </div>
    </div>
  </div>

  <script>
    const processedHeadlines = new Set();
    
    /* INSERT YOUR FREE FINNHUB API KEY HERE */
    const API_KEY = 'YOUR_FINNHUB_API_KEY'; 

    async function fetchMarketNews() {
      /* Finnhub's general news endpoint allows CORS natively. No proxies needed. */
      const apiUrl = `https://finnhub.io/api/v1/news?category=general&token=${API_KEY}`;
      const container = document.getElementById('market-feed');

      try {
        const response = await fetch(apiUrl);
        
        if (!response.ok) {
            throw new Error("Failed to connect to Finnhub.");
        }
        
        const data = await response.json();
        
        const loadingMsg = document.getElementById('loading-msg');
        if (loadingMsg) loadingMsg.remove();

        /* Finnhub returns an array of news objects. We'll take the latest 20 and reverse for UI stacking */
        const items = data.slice(0, 20).reverse();

        items.forEach(item => {
          const title = item.headline;
          
          /* Finnhub returns Unix timestamps in seconds */
          const pubDate = new Date(item.datetime * 1000);
          
          if (title && !processedHeadlines.has(title)) {
            processedHeadlines.add(title);
            
            const headlineEl = document.createElement('div');
            headlineEl.className = 'news-item';
            headlineEl.innerHTML = `
              <div class="news-time">${pubDate.toLocaleTimeString()}</div>
              <div class="news-title">${title}</div>
            `;
            
            container.prepend(headlineEl);
            
            /* CUSTOM AUDIO SQUAWK & FILTER LOGIC */
            const audioEnabled = document.getElementById('squawk-toggle').checked;
            const lowerTitle = title.toLowerCase();
            
            const isImportant = title.toUpperCase() === title || 
                                lowerTitle.includes('breaking') || 
                                lowerTitle.includes('fed') || 
                                lowerTitle.includes('rate') || 
                                lowerTitle.includes('ecb');
            
            const matchesCategory = lowerTitle.includes('gold') || 
                                    lowerTitle.includes('oil') || 
                                    lowerTitle.includes('stocks') || 
                                    lowerTitle.includes('bitcoin');
            
            if (audioEnabled && (isImportant || matchesCategory)) {
              const utterance = new SpeechSynthesisUtterance(title);
              utterance.rate = 1.1; 
              window.speechSynthesis.speak(utterance);
            }
          }
        });
        
      } catch (error) {
        document.getElementById('loading-msg').innerHTML = `<span style="color: red; font-weight: bold;">Connection Error: ${error.message}</span>`;
      }
    }

    fetchMarketNews();
    setInterval(fetchMarketNews, 30000);
  </script>

</body>
</html>
