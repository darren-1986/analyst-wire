<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyst Wire - Market Feed & Squawk</title>
  <style>
    body {
      background: #f4f4f9;
      padding: 20px;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    .widget-container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
    }
    .widget-header {
      background: #111;
      color: #fff;
      padding: 15px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .feed-container {
      max-height: 500px;
      overflow-y: auto;
    }
    .loading-msg {
      padding: 20px;
      color: #666;
      text-align: center;
    }
    .news-item {
      padding: 15px;
      border-bottom: 1px solid #eee;
    }
    .news-time {
      color: #888;
      font-size: 0.8em;
      margin-bottom: 5px;
    }
    .news-title {
      font-weight: bold;
      font-size: 1.05em;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="widget-header">
      <span>Analyst Wire Market Feed</span>
      <label style="cursor: pointer; font-size: 0.9em; font-weight: normal;">
        <input type="checkbox" id="squawk-toggle"> Enable Audio Squawk
      </label>
    </div>
    
    <div id="market-feed" class="feed-container">
      <div id="loading-msg" class="loading-msg">
        Bypassing fetch restrictions...
      </div>
    </div>
  </div>

  <script>
    const processedHeadlines = new Set();

    /* Global callback function required for JSONP */
    window.processSquawkData = function(data) {
      const container = document.getElementById('market-feed');
      const loadingMsg = document.getElementById('loading-msg');
      
      if (data.status !== 'ok') {
        if (loadingMsg) {
          loadingMsg.innerHTML = `<span style="color: red; font-weight: bold;">Data source temporarily unavailable.</span>`;
        }
        return;
      }

      if (loadingMsg) loadingMsg.remove();

      /* Reverse so newest items render at the absolute top */
      const items = data.items.reverse();

      items.forEach(item => {
        const title = item.title;
        const pubDate = item.pubDate;
        
        if (title && !processedHeadlines.has(title)) {
          processedHeadlines.add(title);
          
          const headlineEl = document.createElement('div');
          headlineEl.className = 'news-item';
          headlineEl.innerHTML = `
            <div class="news-time">${new Date(pubDate).toLocaleTimeString()}</div>
            <div class="news-title">${title}</div>
          `;
          
          container.prepend(headlineEl);
          
          /* CUSTOM AUDIO SQUAWK & FILTER LOGIC */
          const audioEnabled = document.getElementById('squawk-toggle').checked;
          const lowerTitle = title.toLowerCase();
          
          const isImportant = title.toUpperCase() === title || 
                              lowerTitle.includes('breaking') || 
                              lowerTitle.includes('fed') || 
                              lowerTitle.includes('rate') || 
                              lowerTitle.includes('ecb');
          
          const matchesCategory = lowerTitle.includes('gold') || 
                                  lowerTitle.includes('oil') || 
                                  lowerTitle.includes('stocks') || 
                                  lowerTitle.includes('bitcoin');
          
          if (audioEnabled && (isImportant || matchesCategory)) {
            const utterance = new SpeechSynthesisUtterance(title);
            utterance.rate = 1.1; 
            window.speechSynthesis.speak(utterance);
          }
        }
      });
    };

    function fetchMarketNewsJSONP() {
      /* CNBC Top Market News feed */
      const rssUrl = 'https://search.cnbc.com/rs/search/combinedcms/view.xml?id=10000664';
      
      /* Create a native script tag to bypass the fetch() API entirely */
      const script = document.createElement('script');
      script.src = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}&callback=processSquawkData`;
      
      /* Clean up the script tag after it runs so they don't pile up */
      script.onload = () => script.remove();
      
      /* If this error triggers, your device has a hard DNS blacklist active */
      script.onerror = () => {
        document.getElementById('loading-msg').innerHTML = `<span style="color: red; font-weight: bold;">Hard Network Block: Your device's privacy shield or Ad-blocker is completely blacklisting the data provider. You must whitelist 'rss2json.com' or disable your shield for this page.</span>`;
      };
      
      document.body.appendChild(script);
    }

    /* Initial load */
    fetchMarketNewsJSONP();
    
    /* Refresh the feed every 30 seconds */
    setInterval(fetchMarketNewsJSONP, 30000);
  </script>

</body>
</html>
