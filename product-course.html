<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="media/favicon.png">
    <title>Macro-Fundamental Analyst Program | Analyst Wire</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #05070a;
            --bg-surface: #161b22;
            --bg-surface-hover: #21262d;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent: #2962ff;
            --accent-hover: #1e4bd8;
            --border: #30363d;
            --success: #2ea043;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-base); color: var(--text-main); line-height: 1.6; }

        /* Navigation */
        header { position: fixed; top: 0; width: 100%; background-color: rgba(5, 7, 10, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); z-index: 1000; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 0.8rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo-img { height: 38px; width: auto; }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .btn-primary { background-color: var(--accent); color: #fff !important; padding: 0.6rem 1.5rem; border-radius: 6px; font-weight: 600; text-decoration: none; }

        /* Course Layout */
        .course-hero { padding: 9rem 2rem 4rem; max-width: 1000px; margin: 0 auto; text-align: center; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 3rem; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* Accordion Syllabus */
        .syllabus-section { padding: 4rem 2rem; max-width: 1200px; margin: 0 auto; }
        .modules-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 1.5rem; }
        .module-card { background-color: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .module-header { padding: 1.2rem; background-color: #1a212c; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .module-header:hover { background-color: var(--bg-surface-hover); }
        .lesson-list { display: none; list-style: none; border-top: 1px solid var(--border); }
        .module-card.active .lesson-list { display: block; }
        .lesson-item { display: flex; align-items: center; padding: 0.8rem 1.2rem; border-bottom: 1px solid rgba(48, 54, 61, 0.4); font-size: 0.9rem; color: var(--text-muted); }
        .lesson-time { font-family: 'JetBrains Mono', monospace; background: rgba(41, 98, 255, 0.15); color: #58a6ff; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; margin-right: 10px; }

        /* Enrollment */
        .enroll-box { text-align: center; margin: 5rem auto; padding: 3rem; border: 2px solid var(--accent); border-radius: 16px; max-width: 800px; }
        .price-tag { font-size: 3rem; font-weight: 700; margin-bottom: 1.5rem; }
        .price-tag span { font-size: 1rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html"><img src="media/logo.png" alt="Logo" class="logo-img"></a>
            <nav class="nav-links">
                <a href="index.html#pricing">Pricing</a>
                <a href="login.html" class="btn-primary">Login</a>
            </nav>
        </div>
    </header>

    <section class="course-hero">
        <h1>Macro-Fundamental Analyst Program</h1>
        <div class="video-container">
            <!-- Wistia embed placeholder -->
        </div>
    </section>

    <section class="syllabus-section">
        <div class="modules-grid" id="curriculum">
            <!-- Example of one module structure -->
            <div class="module-card">
                <div class="module-header" onclick="this.parentElement.classList.toggle('active')">1. Trading Foundations <span>▼</span></div>
                <ul class="lesson-list">
                    <li class="lesson-item"><span class="lesson-time">00:11</span> Financial Market</li>
                    <!-- Add other lessons here -->
                </ul>
            </div>
            <!-- Repeat for modules 2-9 -->
        </div>
    </section>

    <div class="enroll-box">
        <h3>Ready to Master Macro Economics?</h3>
        <div class="price-tag">$200 <span>/ 12 months access</span></div>
        <a href="#" class="btn-primary">Enroll in the Program Now</a>
    </div>

    <script>
        // Simple script to handle accordion toggle if needed, 
        // or just rely on the CSS 'active' class toggle via onclick as shown above.
    </script>
</body>
</html>
