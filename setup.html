<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="media/favicon.png">
    <title>Create Login Details</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f0f0f; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #1a1a1a; padding: 30px; border-radius: 8px; text-align: center; width: 100%; max-width: 400px; }
        input { padding: 12px; width: 100%; box-sizing: border-box; margin: 10px 0; color: black; border-radius: 4px; border: none; }
        button { padding: 12px 20px; cursor: pointer; width: 100%; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; margin-top: 10px; transition: background 0.2s; }
        button:hover { background: #218838; }
        button:disabled { background: #555555; color: #888888; cursor: not-allowed; }
        #status { margin-top: 15px; color: #ff4444; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <img src="media/logo.png" alt="Company Logo" style="max-width: 150px; margin-bottom: 20px;">
    <h2>Create Your Password</h2>
    <p style="color: #b3b3b3; font-size: 14px;">Please set a password for your account.</p>
    
    <input type="password" id="password" placeholder="New Password">
    <input type="password" id="confirmPassword" placeholder="Confirm Password">
    <button id="saveBtn">Save Password & Enter Terminal</button>
    
    <p id="status"></p>
</div>

<script>
    const SUPABASE_URL = 'https://fgidelsazisdqjfckerd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnaWRlbHNhemlzZHFqZmNrZXJkIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4Mjk0NzU4NCwiZXhwIjoyMDk4NTIzNTg0fQ.2UkKkgfJ6oERQrp2VOtiL9YP2MXKVWARAdoEkB5YJbY';
    
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Explicitly handle token exchange from URL hash or query parameters on load
    async function handleIncomingSession() {
        const status = document.getElementById('status');
        
        // Check if there's a recovery code (PKCE flow) or access token in the URL
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const queryParams = new URLSearchParams(window.location.search);
        
        const accessToken = hashParams.get('access_token');
        const refreshToken = hashParams.get('refresh_token');
        const code = queryParams.get('code');

        if (accessToken && refreshToken) {
            // Set the session manually if tokens are in the hash fragment
            const { error } = await client.auth.setSession({
                access_token: accessToken,
                refresh_token: refreshToken
            });
            if (error) {
                status.style.color = "#ff4444";
                status.innerText = "Session Error: " + error.message;
            }
        } else if (code) {
            // Exchange code for session if using PKCE flow
            const { error } = await client.auth.exchangeCodeForSession(code);
            if (error) {
                status.style.color = "#ff4444";
                status.innerText = "Auth Code Error: " + error.message;
            }
        }
    }

    handleIncomingSession();

    document.getElementById('saveBtn').addEventListener('click', async () => {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const status = document.getElementById('status');
        const btn = document.getElementById('saveBtn');
        
        if (!password || password.length < 6) {
            status.style.color = "#ff4444";
            status.innerText = "Password must be at least 6 characters.";
            return;
        }

        if (password !== confirmPassword) {
            status.style.color = "#ff4444";
            status.innerText = "Passwords do not match.";
            return;
        }

        status.style.color = "#b3b3b3";
        status.innerText = "Saving password...";
        btn.disabled = true;

        // Double check session exists right before updating
        const { data: { session } } = await client.auth.getSession();
        if (!session) {
            status.style.color = "#ff4444";
            status.innerText = "Error: Auth session missing! Please open the link from your email again.";
            btn.disabled = false;
            return;
        }

        const { data, error } = await client.auth.updateUser({
            password: password
        });

        if (error) {
            status.style.color = "#ff4444";
            status.innerText = "Error: " + error.message;
            btn.disabled = false;
        } else {
            status.style.color = "#28a745";
            status.innerText = "Success! Redirecting to Terminal...";
            
            setTimeout(() => {
                window.location.href = 'terminal.html';
            }, 1500);
        }
    });
</script>

</body>
</html>
