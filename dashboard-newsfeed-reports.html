<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="media/favicon.png">
<title>LiveSquawk Premium Feed</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://www.livesquawk.com/partner_messenger/css/partner_messenger.css">
<style>
body, .messenger__outer { transition: background 0.3s, color 0.3s; }
/* Dark grey (#0a0a0a) */
body.dark, body.dark .messenger__outer { background-color: #0a0a0a !important; color: #ffffff !important; }
body.light, body.light .messenger__outer { background-color: #ffffff !important; color: #000000 !important; }
body.dark .messenger__outer, body.dark .messenger__outer * { color: #e2e8f0 !important; }

.messenger__outer .newsfeed__title { display: none !important; }

/* --- ADAPTIVE ZOOM --- */
#livesquawk_messenger_outer {
transform-origin: top center;
margin-top: 20px;
transition: transform 0.3s ease;
}

/* Large screens */
@media (min-width: 1200px) { #livesquawk_messenger_outer { transform: scale(1.15); } }
/* Medium screens */
@media (min-width: 768px) and (max-width: 1199px) { #livesquawk_messenger_outer { transform: scale(1.05); } }
/* Mobile */
@media (max-width: 767px) { #livesquawk_messenger_outer { transform: scale(1.0); } }

.messenger__outer { padding-top: 0 !important; margin-top: 0 !important; }
.news__item__latest, .newsfeed__latest { display: none !important; }
.newsfeed__list { margin-top: -10px !important; }
</style>
</head>
<body class="dark">

<div class="messenger__outer" id="livesquawk_messenger_outer"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
const client = supabase.createClient('https://fgidelsazisdqjfckerd.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnaWRlbHNhemlzZHFqZmNrZXJkIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4Mjk0NzU4NCwiZXhwIjoyMDk4NTIzNTg0fQ.2UkKkgfJ6oERQrp2VOtiL9YP2MXKVWARAdoEkB5YJbY');

// --- HELPER FUNCTION: Bulletproof parsing for Arrays, Strings, and JSON ---
function userHasAccess(userTags, requiredTag) {
if (!userTags) return false;
let tagsArray = [];
if (Array.isArray(userTags)) {
tagsArray = userTags;
} else if (typeof userTags === 'string') {
try {
let parsed = JSON.parse(userTags);
tagsArray = Array.isArray(parsed) ? parsed : [userTags];
} catch (e) {
tagsArray = userTags.split(',').map(s => s.trim());
}
}

return tagsArray.some(tag => String(tag).toLowerCase() === requiredTag.toLowerCase());
}

async function checkPermissions() {
const { data: { session } } = await client.auth.getSession();
if (!session) { window.location.href = 'index.html'; return; }
// Query exactly the admin bool and active_tags array using the limit(1) failsafe
const { data: profileArray, error: profileError } = await client
.from('profiles')
.select('admin, active_tags')
.eq('id', session.user.id)
.limit(1);
if (profileError) {
alert("Profile Read Error: " + profileError.message);
await client.auth.signOut();
window.location.href = 'index.html';
return;
}
const profile = profileArray && profileArray.length > 0 ? profileArray[0] : null;
const tags = profile?.active_tags ? profile.active_tags : [];
const isAdmin = profile?.admin === true;
// Strict Authorization Check: Only Admin, Pro, or Newsfeed allowed
const isAuthorized = isAdmin || userHasAccess(tags, 'pro') || userHasAccess(tags, 'newsfeed');
if (!isAuthorized) {
alert("Access denied. Pro or Newsfeed subscription required.");
await client.auth.signOut();
window.location.href = 'index.html';
return;
}
}
checkPermissions();

window.messenger_start_init = function() { if (typeof Messenger !== 'undefined') Messenger.init({ container: '#livesquawk_messenger_outer', product: 'forexanalytic' }); };

// --- BULLETPROOF FILTER ---
// This loop checks twice a second to force-hide anything without the "briefing" keyword.
setInterval(() => {
document.querySelectorAll('.news__item__outer').forEach(item => {
if (item.innerText) {
const text = item.innerText.toLowerCase();
if (!text.includes('briefing')) {
item.style.setProperty('display', 'none', 'important');
}
}
});
}, 500);

Object.defineProperty(window, 'self', { get: () => window.top });
window.addEventListener('load', () => { window.parent.postMessage({ height: document.body.scrollHeight }, '*'); });
</script>
<script src="https://www.livesquawk.com/partner_messenger/js/include_forexanalytic.js?v=3"></script>
</body>
</html>
